name: CI

on:
  push:
    branches: [ "main", "experiment/*", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        flake8 . --count --exclude=.venv*,.git,build,dist --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --exclude=.venv*,.git,build,dist --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest tests/

