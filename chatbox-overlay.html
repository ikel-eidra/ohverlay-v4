<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue - Ohverlay AI Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    user-select: none;
  }

  /* ─── Chatbox Container ─── */
  .chatbox {
    position: absolute;
    width: 260px;
    height: 380px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.3s ease, transform 0.15s ease;
  }
  .chatbox:hover {
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    transform: scale(1.01);
  }

  /* ─── Theme: Glass Dark (default) ─── */
  .theme-glass-dark {
    background: rgba(20, 22, 30, 0.82);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.25);
  }
  .theme-glass-dark .chat-header { background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .theme-glass-dark .chat-title { color: rgba(200,215,255,0.9); }
  .theme-glass-dark .chat-status { color: rgba(140,180,255,0.5); }
  .theme-glass-dark .msg-user { background: rgba(80,130,255,0.2); color: rgba(200,220,255,0.95); }
  .theme-glass-dark .msg-ai { background: rgba(255,255,255,0.06); color: rgba(200,210,230,0.9); }
  .theme-glass-dark .msg-system { color: rgba(140,160,200,0.5); }
  .theme-glass-dark .chat-input-area { background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.06); }
  .theme-glass-dark .chat-input { background: rgba(255,255,255,0.06); color: rgba(200,220,255,0.9); border: 1px solid rgba(255,255,255,0.08); }
  .theme-glass-dark .chat-input::placeholder { color: rgba(140,160,200,0.35); }
  .theme-glass-dark .send-btn { background: rgba(80,130,255,0.3); color: rgba(200,220,255,0.9); border: 1px solid rgba(80,130,255,0.2); }
  .theme-glass-dark .send-btn:hover { background: rgba(80,130,255,0.5); }
  .theme-glass-dark .provider-select { background: rgba(255,255,255,0.06); color: rgba(200,220,255,0.7); border: 1px solid rgba(255,255,255,0.08); }
  .theme-glass-dark .web-badge { background: rgba(100,200,150,0.15); color: rgba(100,220,160,0.7); }
  .theme-glass-dark .settings-btn { color: rgba(180,200,240,0.4); }
  .theme-glass-dark .settings-panel { background: rgba(15,18,25,0.95); border: 1px solid rgba(255,255,255,0.08); }
  .theme-glass-dark .settings-label { color: rgba(180,200,230,0.6); }
  .theme-glass-dark .settings-input { background: rgba(255,255,255,0.06); color: rgba(200,220,255,0.85); border: 1px solid rgba(255,255,255,0.1); }
  .theme-glass-dark .theme-dot { border-color: rgba(255,255,255,0.15); }

  /* ─── Theme: Glass Light ─── */
  .theme-glass-light {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(0,0,0,0.08);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.12);
  }
  .theme-glass-light .chat-header { background: rgba(0,0,0,0.02); border-bottom: 1px solid rgba(0,0,0,0.06); }
  .theme-glass-light .chat-title { color: #2a3a50; }
  .theme-glass-light .chat-status { color: rgba(60,100,160,0.5); }
  .theme-glass-light .msg-user { background: rgba(60,120,255,0.1); color: #2a3a50; }
  .theme-glass-light .msg-ai { background: rgba(0,0,0,0.04); color: #3a4a5a; }
  .theme-glass-light .msg-system { color: rgba(60,80,120,0.45); }
  .theme-glass-light .chat-input-area { background: rgba(0,0,0,0.02); border-top: 1px solid rgba(0,0,0,0.06); }
  .theme-glass-light .chat-input { background: rgba(0,0,0,0.04); color: #2a3a50; border: 1px solid rgba(0,0,0,0.08); }
  .theme-glass-light .chat-input::placeholder { color: rgba(60,80,120,0.35); }
  .theme-glass-light .send-btn { background: rgba(60,120,255,0.15); color: #3a5a8a; border: 1px solid rgba(60,120,255,0.15); }
  .theme-glass-light .send-btn:hover { background: rgba(60,120,255,0.3); }
  .theme-glass-light .provider-select { background: rgba(0,0,0,0.04); color: #3a5a8a; border: 1px solid rgba(0,0,0,0.08); }
  .theme-glass-light .web-badge { background: rgba(40,160,100,0.1); color: rgba(30,130,80,0.7); }
  .theme-glass-light .settings-btn { color: rgba(60,80,120,0.4); }
  .theme-glass-light .settings-panel { background: rgba(255,255,255,0.97); border: 1px solid rgba(0,0,0,0.1); }
  .theme-glass-light .settings-label { color: #5a6a7a; }
  .theme-glass-light .settings-input { background: rgba(0,0,0,0.04); color: #2a3a50; border: 1px solid rgba(0,0,0,0.1); }
  .theme-glass-light .theme-dot { border-color: rgba(0,0,0,0.15); }

  /* ─── Theme: Frosted Pink ─── */
  .theme-frosted-pink {
    background: rgba(255, 220, 230, 0.78);
    border: 1px solid rgba(200,100,140,0.1);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.12);
  }
  .theme-frosted-pink .chat-header { background: rgba(255,200,220,0.15); border-bottom: 1px solid rgba(200,100,140,0.08); }
  .theme-frosted-pink .chat-title { color: #8a3a55; }
  .theme-frosted-pink .chat-status { color: rgba(160,60,100,0.45); }
  .theme-frosted-pink .msg-user { background: rgba(200,80,130,0.12); color: #6a2a45; }
  .theme-frosted-pink .msg-ai { background: rgba(255,255,255,0.25); color: #5a3a4a; }
  .theme-frosted-pink .msg-system { color: rgba(160,80,110,0.45); }
  .theme-frosted-pink .chat-input-area { background: rgba(255,200,220,0.1); border-top: 1px solid rgba(200,100,140,0.08); }
  .theme-frosted-pink .chat-input { background: rgba(255,255,255,0.3); color: #6a2a45; border: 1px solid rgba(200,100,140,0.1); }
  .theme-frosted-pink .chat-input::placeholder { color: rgba(160,80,110,0.35); }
  .theme-frosted-pink .send-btn { background: rgba(200,80,130,0.15); color: #8a3a55; border: 1px solid rgba(200,80,130,0.1); }
  .theme-frosted-pink .send-btn:hover { background: rgba(200,80,130,0.3); }
  .theme-frosted-pink .provider-select { background: rgba(255,255,255,0.25); color: #6a2a45; border: 1px solid rgba(200,100,140,0.1); }
  .theme-frosted-pink .web-badge { background: rgba(40,160,100,0.1); color: rgba(40,140,90,0.6); }
  .theme-frosted-pink .settings-btn { color: rgba(160,80,110,0.4); }
  .theme-frosted-pink .settings-panel { background: rgba(255,235,240,0.97); border: 1px solid rgba(200,100,140,0.12); }
  .theme-frosted-pink .settings-label { color: #8a5a6a; }
  .theme-frosted-pink .settings-input { background: rgba(255,255,255,0.4); color: #6a2a45; border: 1px solid rgba(200,100,140,0.12); }
  .theme-frosted-pink .theme-dot { border-color: rgba(200,100,140,0.2); }

  /* ─── Header ─── */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    cursor: grab;
    flex-shrink: 0;
  }
  .chat-header:active { cursor: grabbing; }
  .header-left { display: flex; align-items: center; gap: 6px; }
  .chat-title { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
  .web-badge {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 2px 5px;
    border-radius: 3px;
    font-weight: 600;
  }
  .chat-status { font-size: 9px; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .settings-btn {
    background: none; border: none;
    font-size: 14px; cursor: pointer;
    padding: 2px; line-height: 1;
  }
  .settings-btn:hover { opacity: 0.8; }

  /* ─── Messages Area ─── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(128,128,128,0.2) transparent;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 2px; }

  .msg {
    max-width: 88%;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.45;
    word-wrap: break-word;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-user { align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg-ai { align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg-system {
    align-self: center;
    font-size: 9px;
    font-style: italic;
    text-align: center;
    padding: 4px;
  }
  .msg-ai .typing-dots::after {
    content: '...';
    animation: dots 1s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  /* ─── Input Area ─── */
  .chat-input-area {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    padding: 6px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
    resize: none;
    min-height: 28px;
    max-height: 60px;
    cursor: text;
    user-select: text;
  }
  .chat-input:focus { border-color: rgba(80,130,255,0.3); }
  .send-btn {
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
    align-self: flex-end;
    font-weight: 500;
    transition: background 0.2s;
  }

  /* ─── Settings Panel ─── */
  .settings-panel {
    display: none;
    position: absolute;
    top: 36px; right: 8px;
    width: 230px;
    border-radius: 8px;
    padding: 12px;
    z-index: 10;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }
  .settings-panel.visible { display: block; }

  .settings-group {
    margin-bottom: 10px;
  }
  .settings-group:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
    display: block;
  }
  .settings-input {
    width: 100%;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 10px;
    outline: none;
    cursor: text;
    user-select: text;
  }
  .settings-input:focus { border-color: rgba(80,130,255,0.3); }

  .provider-select {
    width: 100%;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 10px;
    outline: none;
    cursor: pointer;
    appearance: none;
  }

  .theme-dots {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .theme-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid;
    transition: transform 0.2s;
  }
  .theme-dot:hover { transform: scale(1.2); }
  .theme-dot.active { transform: scale(1.15); border-width: 3px; }
</style>
</head>
<body>

<div class="chatbox theme-glass-dark" id="chatbox">
  <!-- Header (drag handle) -->
  <div class="chat-header" id="chatHeader">
    <div class="header-left">
      <span class="chat-title">Blue</span>
      <span class="web-badge">WEB</span>
    </div>
    <div class="header-right">
      <span class="chat-status" id="chatStatus">ready</span>
      <button class="settings-btn" id="settingsBtn" title="Settings">&#9881;</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="msg msg-system">Hi! I'm Blue, your Ohverlay assistant. I remember our conversations. How can I help?</div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Ask me anything..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-group">
      <label class="settings-label">LLM Provider</label>
      <select class="provider-select" id="providerSelect">
        <option value="groq">Groq (Free - Llama)</option>
        <option value="together">Together AI (Free tier)</option>
        <option value="openrouter">OpenRouter (Free models)</option>
        <option value="cohere">Cohere (Free - Command)</option>
        <option value="custom">Custom API</option>
      </select>
    </div>
    <div class="settings-group">
      <label class="settings-label">API Key</label>
      <input type="password" class="settings-input" id="apiKeyInput" placeholder="Paste your API key...">
    </div>
    <div class="settings-group" id="customUrlGroup" style="display:none;">
      <label class="settings-label">Custom API URL</label>
      <input type="text" class="settings-input" id="customUrlInput" placeholder="https://api.example.com/v1/chat/completions">
    </div>
    <div class="settings-group" id="customModelGroup" style="display:none;">
      <label class="settings-label">Model Name</label>
      <input type="text" class="settings-input" id="customModelInput" placeholder="model-name">
    </div>
    <div class="settings-group">
      <label class="settings-label">Theme</label>
      <div class="theme-dots">
        <div class="theme-dot active" data-theme="glass-dark" style="background:#14161e;" title="Glass Dark"></div>
        <div class="theme-dot" data-theme="glass-light" style="background:#f8f8ff;" title="Glass Light"></div>
        <div class="theme-dot" data-theme="frosted-pink" style="background:#ffdce6;" title="Frosted Pink"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ─── Elements ─── */
const chatbox = document.getElementById('chatbox');
const chatHeader = document.getElementById('chatHeader');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const providerSelect = document.getElementById('providerSelect');
const apiKeyInput = document.getElementById('apiKeyInput');
const customUrlInput = document.getElementById('customUrlInput');
const customModelInput = document.getElementById('customModelInput');
const customUrlGroup = document.getElementById('customUrlGroup');
const customModelGroup = document.getElementById('customModelGroup');
const chatStatus = document.getElementById('chatStatus');

/* ─── State ─── */
let currentTheme = 'glass-dark';
let isProcessing = false;
let conversationHistory = [];

/* ─── Blue's Memory System (localStorage-based for HTML overlay) ─── */
const BlueMemory = {
  _key: 'ohverlay-blue-memory',

  _load() {
    try {
      return JSON.parse(localStorage.getItem(this._key)) || this._defaults();
    } catch(e) { return this._defaults(); }
  },

  _defaults() {
    return {
      userFacts: [],         // {category, fact, timestamp}
      conversationLog: [],   // {role, content, timestamp} - last 200
      reminders: [],         // {content, deadline, completed}
      preferences: {},       // key-value pairs
      sessionCount: 0,
      firstSeen: Date.now(),
      lastSeen: Date.now(),
    };
  },

  _save(data) {
    try { localStorage.setItem(this._key, JSON.stringify(data)); } catch(e) {}
  },

  addFact(category, fact) {
    const data = this._load();
    const existing = data.userFacts.find(f => f.category === category && f.fact === fact);
    if (!existing) {
      data.userFacts.push({ category, fact, timestamp: Date.now() });
      if (data.userFacts.length > 100) data.userFacts = data.userFacts.slice(-100);
    }
    this._save(data);
  },

  logMessage(role, content) {
    const data = this._load();
    data.conversationLog.push({ role, content, timestamp: Date.now() });
    if (data.conversationLog.length > 200) data.conversationLog = data.conversationLog.slice(-200);
    data.lastSeen = Date.now();
    this._save(data);
  },

  addReminder(content, deadline) {
    const data = this._load();
    data.reminders.push({ content, deadline, completed: false, created: Date.now() });
    this._save(data);
  },

  setPref(key, value) {
    const data = this._load();
    data.preferences[key] = value;
    this._save(data);
  },

  startSession() {
    const data = this._load();
    data.sessionCount++;
    data.lastSeen = Date.now();
    this._save(data);
  },

  buildContext() {
    const data = this._load();
    const parts = [];

    if (data.userFacts.length > 0) {
      parts.push('Known facts about user:');
      const byCategory = {};
      data.userFacts.forEach(f => {
        if (!byCategory[f.category]) byCategory[f.category] = [];
        byCategory[f.category].push(f.fact);
      });
      for (const [cat, facts] of Object.entries(byCategory)) {
        parts.push('  ' + cat + ': ' + facts.slice(-5).join(', '));
      }
    }

    const activeReminders = (data.reminders || []).filter(r => !r.completed);
    if (activeReminders.length > 0) {
      parts.push('\nActive reminders:');
      activeReminders.slice(-5).forEach(r => {
        let dl = r.deadline ? ' (due: ' + new Date(r.deadline).toLocaleString() + ')' : '';
        parts.push('  - ' + r.content + dl);
      });
    }

    const daysSinceFirst = Math.floor((Date.now() - data.firstSeen) / 86400000);
    parts.push('\nRelationship: ' + data.sessionCount + ' sessions over ' + daysSinceFirst + ' days');

    // Recent conversation summary (last 6 messages for context)
    if (data.conversationLog.length > 0) {
      parts.push('\nRecent conversation topics (for continuity):');
      data.conversationLog.slice(-6).forEach(m => {
        parts.push('  ' + m.role + ': ' + m.content.slice(0, 80));
      });
    }

    return parts.join('\n');
  },

  // Extract facts from user messages using simple pattern matching
  extractFacts(message) {
    const lower = message.toLowerCase();
    const patterns = [
      { re: /my name is (\w+)/i, cat: 'identity', fmt: m => 'Name: ' + m[1] },
      { re: /i(?:'m| am) (\d+) years? old/i, cat: 'identity', fmt: m => 'Age: ' + m[1] },
      { re: /i live in (.+?)(?:\.|,|$)/i, cat: 'location', fmt: m => m[1].trim() },
      { re: /i (?:like|love|enjoy) (.+?)(?:\.|,|!|$)/i, cat: 'likes', fmt: m => m[1].trim() },
      { re: /i (?:hate|dislike|don't like) (.+?)(?:\.|,|!|$)/i, cat: 'dislikes', fmt: m => m[1].trim() },
      { re: /i work (?:at|for|in) (.+?)(?:\.|,|$)/i, cat: 'work', fmt: m => m[1].trim() },
      { re: /i(?:'m| am) a (.+?)(?:\.|,|$)/i, cat: 'identity', fmt: m => m[1].trim() },
      { re: /my (?:birthday|bday) is (.+?)(?:\.|,|$)/i, cat: 'identity', fmt: m => 'Birthday: ' + m[1].trim() },
      { re: /call me (\w+)/i, cat: 'identity', fmt: m => 'Preferred name: ' + m[1] },
      { re: /remind me (?:to |about )?(.+?)(?:\.|!|$)/i, cat: 'reminder', fmt: m => m[1].trim() },
    ];

    patterns.forEach(p => {
      const match = message.match(p.re);
      if (match) {
        if (p.cat === 'reminder') {
          this.addReminder(p.fmt(match), null);
        } else {
          this.addFact(p.cat, p.fmt(match));
        }
      }
    });
  }
};

// Start session on load
BlueMemory.startSession();

/* ─── LLM Provider Configs ─── */
const providers = {
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    model: 'llama-3.3-70b-versatile',
    name: 'Groq',
  },
  together: {
    url: 'https://api.together.xyz/v1/chat/completions',
    model: 'meta-llama/Llama-3.3-70B-Instruct-Turbo',
    name: 'Together AI',
  },
  openrouter: {
    url: 'https://openrouter.ai/api/v1/chat/completions',
    model: 'meta-llama/llama-3.3-70b-instruct:free',
    name: 'OpenRouter',
  },
  cohere: {
    url: 'https://api.cohere.ai/v2/chat',
    model: 'command-r',
    name: 'Cohere',
  },
  custom: {
    url: '',
    model: '',
    name: 'Custom',
  },
};

// Load saved settings
try {
  const saved = localStorage.getItem('ohverlay-chat-settings');
  if (saved) {
    const s = JSON.parse(saved);
    if (s.provider) providerSelect.value = s.provider;
    if (s.apiKey) apiKeyInput.value = s.apiKey;
    if (s.customUrl) customUrlInput.value = s.customUrl;
    if (s.customModel) customModelInput.value = s.customModel;
    if (s.theme) {
      currentTheme = s.theme;
      chatbox.className = 'chatbox theme-' + s.theme;
      document.querySelectorAll('.theme-dot').forEach(d => {
        d.classList.toggle('active', d.dataset.theme === s.theme);
      });
    }
  }
} catch(e) {}

function saveSettings() {
  try {
    localStorage.setItem('ohverlay-chat-settings', JSON.stringify({
      provider: providerSelect.value,
      apiKey: apiKeyInput.value,
      customUrl: customUrlInput.value,
      customModel: customModelInput.value,
      theme: currentTheme,
    }));
  } catch(e) {}
}

/* ─── Position ─── */
let boxX = window.innerWidth - 300;
let boxY = window.innerHeight - 430;
chatbox.style.left = boxX + 'px';
chatbox.style.top = boxY + 'px';

/* ─── Dragging (header only) ─── */
let isDragging = false;
let dragOffX = 0, dragOffY = 0;

chatHeader.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  isDragging = true;
  dragOffX = e.clientX - boxX;
  dragOffY = e.clientY - boxY;
  chatbox.style.transition = 'none';
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  boxX = e.clientX - dragOffX;
  boxY = e.clientY - dragOffY;
  boxX = Math.max(-80, Math.min(window.innerWidth - 180, boxX));
  boxY = Math.max(-10, Math.min(window.innerHeight - 60, boxY));
  chatbox.style.left = boxX + 'px';
  chatbox.style.top = boxY + 'px';
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    chatbox.style.transition = 'box-shadow 0.3s ease, transform 0.15s ease';
  }
});

/* ─── Settings Panel ─── */
settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('visible');
});

// Close settings when clicking outside
chatbox.addEventListener('click', (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
    settingsPanel.classList.remove('visible');
  }
});

// Show/hide custom URL fields
providerSelect.addEventListener('change', () => {
  const isCustom = providerSelect.value === 'custom';
  customUrlGroup.style.display = isCustom ? 'block' : 'none';
  customModelGroup.style.display = isCustom ? 'block' : 'none';
  saveSettings();
});
// Init visibility
if (providerSelect.value === 'custom') {
  customUrlGroup.style.display = 'block';
  customModelGroup.style.display = 'block';
}

apiKeyInput.addEventListener('input', saveSettings);
customUrlInput.addEventListener('input', saveSettings);
customModelInput.addEventListener('input', saveSettings);

/* ─── Theme Switching ─── */
document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    const theme = dot.dataset.theme;
    chatbox.classList.remove('theme-' + currentTheme);
    chatbox.classList.add('theme-' + theme);
    currentTheme = theme;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    saveSettings();
  });
});

/* ─── Message Functions ─── */
function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + type;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.id = 'typingIndicator';
  div.innerHTML = '<span class="typing-dots">Thinking</span>';
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

/* ─── LLM API Call ─── */
async function callLLM(userMessage) {
  const provider = providerSelect.value;
  const apiKey = apiKeyInput.value.trim();

  if (!apiKey) {
    addMessage('Please set your API key in settings (click the gear icon).', 'system');
    return;
  }

  const config = providers[provider];
  let url = config.url;
  let model = config.model;

  if (provider === 'custom') {
    url = customUrlInput.value.trim();
    model = customModelInput.value.trim();
    if (!url) {
      addMessage('Please set the custom API URL in settings.', 'system');
      return;
    }
  }

  // Extract facts from user message and log it
  BlueMemory.extractFacts(userMessage);
  BlueMemory.logMessage('user', userMessage);

  // Build conversation
  conversationHistory.push({ role: 'user', content: userMessage });

  // Build Blue's system prompt with memory context
  const memoryContext = BlueMemory.buildContext();
  const systemPrompt = 'You are Blue, a warm, friendly, and helpful AI desktop assistant that lives inside Ohverlay. ' +
    'You are like a caring companion who remembers things about the user and genuinely wants to help.\n\n' +
    'Personality: Warm, supportive, a little playful. Use casual language but stay helpful and smart. ' +
    'Keep responses concise (2-4 sentences) unless asked for more detail. ' +
    'If the user speaks Tagalog/Filipino, respond naturally in the same language. ' +
    'You proactively remind users about deadlines and health (20-20-20 eye rule).\n\n' +
    (memoryContext ? '--- YOUR MEMORY ---\n' + memoryContext + '\n--- END MEMORY ---\n' : '');

  const messages = [
    { role: 'system', content: systemPrompt },
    ...conversationHistory.slice(-20),
  ];

  isProcessing = true;
  chatStatus.textContent = 'thinking...';
  const typingEl = addTypingIndicator();

  try {
    // Cohere uses a different API format
    let body, headers;

    if (provider === 'cohere') {
      body = JSON.stringify({
        model: model,
        messages: messages,
      });
      headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
      };
    } else {
      body = JSON.stringify({
        model: model,
        messages: messages,
        max_tokens: 500,
        temperature: 0.7,
      });
      headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
      };

      // OpenRouter needs extra headers
      if (provider === 'openrouter') {
        headers['HTTP-Referer'] = 'https://ohverlay.app';
        headers['X-Title'] = 'Ohverlay Desktop';
      }
    }

    const response = await fetch(url, { method: 'POST', headers, body });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API error ' + response.status + ': ' + errText.slice(0, 150));
    }

    const data = await response.json();
    let aiText = '';

    if (provider === 'cohere') {
      aiText = data.message?.content?.[0]?.text || data.text || 'No response received.';
    } else {
      aiText = data.choices?.[0]?.message?.content || 'No response received.';
    }

    conversationHistory.push({ role: 'assistant', content: aiText });
    BlueMemory.logMessage('assistant', aiText);

    removeTypingIndicator();
    addMessage(aiText, 'ai');
    chatStatus.textContent = 'ready';

  } catch (err) {
    removeTypingIndicator();
    addMessage('Error: ' + err.message, 'system');
    chatStatus.textContent = 'error';
    setTimeout(() => { chatStatus.textContent = 'ready'; }, 3000);
  }

  isProcessing = false;
}

/* ─── Send Message ─── */
function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isProcessing) return;

  addMessage(text, 'user');
  chatInput.value = '';
  chatInput.style.height = 'auto';

  callLLM(text);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 60) + 'px';
});

/* ─── Resize ─── */
window.addEventListener('resize', () => {
  boxX = Math.min(boxX, window.innerWidth - 180);
  boxY = Math.min(boxY, window.innerHeight - 60);
  chatbox.style.left = boxX + 'px';
  chatbox.style.top = boxY + 'px';
});
</script>
