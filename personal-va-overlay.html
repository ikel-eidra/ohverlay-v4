<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal VA Companion Overlay — Ollama AI & OpenClaw Skills</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    
    .va-card {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 340px;
      background: rgba(13, 19, 32, 0.90);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 18px;
      padding: 20px;
      color: #f3f4f6;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 0.2s ease;
    }

    .va-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .va-avatar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .va-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
    }

    .va-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .va-subtitle {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .va-status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* AI Response Bubble */
    .ai-chat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #e2e8f0;
      max-height: 120px;
      overflow-y: auto;
    }

    .skill-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .task-input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .task-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 9px 14px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }

    .task-input:focus {
      border-color: #3b82f6;
    }

    .btn-ask {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-ask:hover { transform: translateY(-1px); }

    .skills-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .skill-badge-item {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="va-card" id="vaCard">
    <div class="va-header">
      <div class="va-avatar-title">
        <div class="va-avatar">🤖</div>
        <div>
          <div class="va-title">Personal VA Companion</div>
          <div class="va-subtitle">
            <span class="va-status-badge">🟢 Ollama Brain Ready</span>
          </div>
        </div>
      </div>
    </div>

    <!-- AI Output Response -->
    <div class="ai-chat-box" id="aiChatBox">
      <span class="skill-chip">⚙️ OpenClaw Skills Connected</span><br>
      Hello! I'm your local offline VA. Ask me anything, search the web, or manage your workstation tasks.
    </div>

    <!-- User Chat Input -->
    <div class="task-input-box">
      <input type="text" id="vaInput" class="task-input" placeholder="Ask Ollama or type 'search <query>'..." />
      <button class="btn-ask" id="btnAsk">Ask</button>
    </div>

    <!-- Active Skill Badges -->
    <div class="skills-row">
      <span class="skill-badge-item">🧠 Local Ollama LLM</span>
      <span class="skill-badge-item">🌐 OpenClaw Web Scraper</span>
      <span class="skill-badge-item">☀️ Weather Skill</span>
    </div>
  </div>

  <script>
    const vaInput = document.getElementById('vaInput');
    const btnAsk = document.getElementById('btnAsk');
    const aiChatBox = document.getElementById('aiChatBox');

    function handleAsk() {
      const q = vaInput.value.trim();
      if (!q) return;

      aiChatBox.innerHTML = `<span class="skill-chip">⚡ Processing Skill...</span><br><em>"${q}"</em>`;
      vaInput.value = '';

      // Simulated local skill response fallback if standalone HTML preview
      setTimeout(() => {
        if (q.toLowerCase().startsWith('search ') || q.toLowerCase().startsWith('openclaw ')) {
          aiChatBox.innerHTML = `<span class="skill-chip">🌐 OpenClaw Web Result</span><br>Found latest snippets for <strong>${q.substring(7)}</strong>. Local Ollama summarized the results cleanly.`;
        } else if (q.toLowerCase().includes('weather')) {
          aiChatBox.innerHTML = `<span class="skill-chip">☀️ Weather Skill</span><br>Manila, PH: 29°C, Clear Sky. Light breeze from East.`;
        } else {
          aiChatBox.innerHTML = `<span class="skill-chip">🤖 Ollama (llama3.2)</span><br>I have processed your workstation request locally without sending any data to the cloud.`;
        }
      }, 600);
    }

    btnAsk.addEventListener('click', handleAsk);
    vaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAsk(); });
  </script>
</body>
</html>
