# ============================================================
# OHVERLAY FACTORY - Docker Compose Stack
# The central brain powering ohverlay.com
# ============================================================
#
# Services:
#   factory-api  - FastAPI backend (overlay catalog, Blue AI, updates)
#   factory-db   - PostgreSQL (users, overlays, analytics, memories)
#   factory-cache - Redis (API caching, rate limiting, sessions)
#   n8n          - Automation workflows (daily overlays, content, deploys)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f api    # Watch API logs
#   docker-compose down           # Stop all
#
# ============================================================

services:

  # ─── Factory API Server ───
  factory-api:
    build:
      context: ..
      dockerfile: factory/Dockerfile
    container_name: ohverlay-factory-api
    ports:
      - "8400:8400"
    environment:
      - FACTORY_URL=https://ohverlay.com
      - FACTORY_PORT=8400
      - DATABASE_URL=postgresql://ohverlay:ohverlay_secret@factory-db:5432/ohverlay_factory
      - REDIS_URL=redis://factory-cache:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - N8N_URL=http://n8n:5678
      - N8N_WEBHOOK_KEY=${N8N_WEBHOOK_KEY}
    volumes:
      - overlay-data:/data/overlays
      - release-data:/data/releases
    depends_on:
      - factory-db
      - factory-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── PostgreSQL Database ───
  factory-db:
    image: postgres:16-alpine
    container_name: ohverlay-factory-db
    environment:
      POSTGRES_DB: ohverlay_factory
      POSTGRES_USER: ohverlay
      POSTGRES_PASSWORD: ohverlay_secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # ─── Redis Cache ───
  factory-cache:
    image: redis:7-alpine
    container_name: ohverlay-factory-cache
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data
    restart: unless-stopped

  # ─── n8n Automation Engine ───
  # Handles: daily overlay generation, content curation,
  #          update deployments, notifications, analytics
  n8n:
    image: n8nio/n8n:latest
    container_name: ohverlay-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-ohverlay_n8n}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://ohverlay.com/n8n/
      - GENERIC_TIMEZONE=Asia/Manila
      # Factory API connection
      - FACTORY_API_URL=http://factory-api:8400
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - factory-api
    restart: unless-stopped

volumes:
  db-data:
  cache-data:
  n8n-data:
  overlay-data:
  release-data:
