<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Woman on Bicycle</title>
<!-- Duration: 20 minutes recommended for eye relief -->
<!-- Pairs well with: fairy-dandelion.html, manta-ray-overlay.html -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ─── Utilities ─── */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

/* ─── Multi-color gradient palette ─── */
const colorStops = [
  [100, 200, 255],  // Cyan
  [255, 100, 200],  // Magenta
  [255, 255, 255],  // White
  [100, 255, 180],  // Green
];

function getGradientColor(phase, alpha) {
  const len = colorStops.length;
  const idx = ((phase % 1) + 1) % 1 * len;
  const i0 = Math.floor(idx) % len;
  const i1 = (i0 + 1) % len;
  const frac = idx - Math.floor(idx);
  const c0 = colorStops[i0];
  const c1 = colorStops[i1];
  const r = Math.round(lerp(c0[0], c1[0], frac));
  const g = Math.round(lerp(c0[1], c1[1], frac));
  const b = Math.round(lerp(c0[2], c1[2], frac));
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ─── Wind Leaf ─── */
class WindLeaf {
  constructor() { this.reset(true); }

  reset(offscreen) {
    this.x = offscreen ? rand(-100, W + 100) : rand(W + 50, W + 200);
    this.y = rand(-50, H * 0.7);
    this.size = rand(4, 10);
    this.rotation = rand(0, TAU);
    this.spinSpeed = rand(-2, 2);
    this.vx = rand(-30, -60);
    this.vy = rand(10, 30);
    this.wobblePhase = rand(0, TAU);
    this.alpha = rand(0.2, 0.5);
    this.colorPhase = rand(0, 1);
    this.life = 1;
    this.decay = rand(0.003, 0.008);
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt + Math.sin(this.wobblePhase) * 15 * dt;
    this.wobblePhase += 1.5 * dt;
    this.rotation += this.spinSpeed * dt;
    this.life -= this.decay * dt * 60;
    if (this.life <= 0 || this.x < -100 || this.y > H + 50) this.reset(false);
  }

  draw(ctx, t) {
    const a = this.alpha * this.life;
    if (a < 0.01) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.strokeStyle = getGradientColor(this.colorPhase + t * 0.1, a);
    ctx.lineWidth = 0.7;
    const s = this.size;
    // Triangular wireframe leaf
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(-s * 0.6, s * 0.5);
    ctx.lineTo(s * 0.6, s * 0.5);
    ctx.closePath();
    ctx.stroke();
    // Vein
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(0, s * 0.5);
    ctx.stroke();
    ctx.restore();
  }
}

/* ─── Dust Particle ─── */
class DustParticle {
  constructor() { this.reset(true); }

  reset(initial) {
    this.x = initial ? rand(0, W) : rand(W, W + 200);
    this.y = rand(0, H);
    this.size = rand(0.5, 2);
    this.vx = rand(-20, -40);
    this.vy = rand(-5, 5);
    this.alpha = rand(0.1, 0.35);
    this.colorPhase = rand(0, 1);
    this.pulsePhase = rand(0, TAU);
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.pulsePhase += 2 * dt;
    if (this.x < -20) this.reset(false);
  }

  draw(ctx, t) {
    const pulse = 0.7 + Math.sin(this.pulsePhase) * 0.3;
    const a = this.alpha * pulse;
    ctx.fillStyle = getGradientColor(this.colorPhase + t * 0.05, a);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, TAU);
    ctx.fill();
  }
}

/* ─── Ghost Woman on Bicycle ─── */
class GhostWoman {
  constructor(x, y, size) {
    this.baseX = x;
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.size = size;
    this.pedalAngle = 0;
    this.breathPhase = 0;
    this.colorPhase = 0;
    this.glitchTimer = 0;
    this.glitchActive = false;
    this.glitchOffsetX = 0;
    this.trail = [];
    this.flickerAlpha = 1;
    this.direction = 1; // 1 = right, -1 = left
    this.hairStrands = [];
    for (let i = 0; i < 8; i++) {
      this.hairStrands.push({ phase: rand(0, TAU), len: rand(0.15, 0.25), wave: rand(0.5, 1.5) });
    }
  }

  update(t, dt) {
    // Horizontal movement - gentle sine path
    this.x = this.baseX + Math.sin(t * 0.15) * (W * 0.3);
    this.direction = Math.cos(t * 0.15) > 0 ? 1 : -1;

    // Subtle vertical bob from pedaling
    this.y = this.baseY + Math.sin(t * 3) * 3;

    // Pedaling
    this.pedalAngle = t * 3.0;

    // Breathing
    this.breathPhase += 1.8 * dt;

    // Color cycling
    this.colorPhase = t * 0.08;

    // Flicker
    this.flickerAlpha = 0.85 + Math.sin(t * 2.3) * 0.1 + Math.sin(t * 5.7) * 0.03;

    // Glitch (rare)
    this.glitchTimer -= dt;
    if (this.glitchTimer <= 0) {
      if (Math.random() < 0.05) {
        this.glitchActive = true;
        this.glitchOffsetX = rand(-8, 8);
        this.glitchTimer = rand(0.05, 0.12);
      } else {
        this.glitchActive = false;
        this.glitchOffsetX = 0;
        this.glitchTimer = rand(0.3, 1.5);
      }
    }

    // Trail
    if (Math.random() < 0.3) {
      this.trail.push({ x: this.x, y: this.y, alpha: 0.25, age: 0 });
    }
    this.trail = this.trail.filter(tr => {
      tr.age += dt;
      tr.alpha = 0.25 * Math.max(0, 1 - tr.age * 1.5);
      return tr.alpha > 0.01;
    });
  }

  draw(ctx, t) {
    // Draw trail (afterimages)
    for (const tr of this.trail) {
      ctx.save();
      ctx.globalAlpha = tr.alpha * 0.3;
      ctx.translate(tr.x, tr.y);
      ctx.scale(this.direction, 1);
      this._drawBicycleFrame(ctx, t, true);
      this._drawBodySimple(ctx, t, true);
      ctx.restore();
    }

    // Main figure
    ctx.save();
    ctx.globalAlpha = this.flickerAlpha;

    // Glitch slice effect
    if (this.glitchActive) {
      ctx.save();
      ctx.beginPath();
      const sliceY = this.y - this.size * 0.3 + rand(0, this.size * 0.6);
      ctx.rect(0, sliceY, W, this.size * 0.08);
      ctx.clip();
      ctx.translate(this.x + this.glitchOffsetX, this.y);
      ctx.scale(this.direction, 1);
      this._drawAll(ctx, t);
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, sliceY);
      ctx.rect(0, sliceY + this.size * 0.08, W, H);
      ctx.clip();
      ctx.translate(this.x, this.y);
      ctx.scale(this.direction, 1);
      this._drawAll(ctx, t);
      ctx.restore();
    } else {
      ctx.translate(this.x, this.y);
      ctx.scale(this.direction, 1);
      this._drawAll(ctx, t);
    }

    ctx.restore();
  }

  _drawAll(ctx, t) {
    this._drawGlow(ctx, t);
    this._drawBicycleFrame(ctx, t, false);
    this._drawDress(ctx, t);
    this._drawBody(ctx, t);
    this._drawHair(ctx, t);
    this._drawScanlines(ctx, t);
    this._drawChromatic(ctx, t);
  }

  _drawGlow(ctx, t) {
    const s = this.size;
    const pulse = 0.6 + Math.sin(t * 1.5) * 0.15;

    // Aura rings
    for (let ring = 0; ring < 3; ring++) {
      const r = s * (0.4 + ring * 0.2) * pulse;
      const a = (0.06 - ring * 0.015);
      ctx.strokeStyle = getGradientColor(this.colorPhase + ring * 0.15, a);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.1, r, r * 0.7, 0, 0, TAU);
      ctx.stroke();
    }

    // Core glow
    const grd = ctx.createRadialGradient(0, -s * 0.1, 0, 0, -s * 0.1, s * 0.5);
    grd.addColorStop(0, getGradientColor(this.colorPhase, 0.06));
    grd.addColorStop(0.5, getGradientColor(this.colorPhase + 0.2, 0.02));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-s, -s, s * 2, s * 2);
  }

  _drawBicycleFrame(ctx, t, simple) {
    const s = this.size;
    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const frontX = s * 0.2;
    const seatY = bikeY - wheelR * 0.9;
    const handleY = bikeY - wheelR * 1.1;
    const alpha = simple ? 0.15 : 0.6;

    ctx.strokeStyle = getGradientColor(this.colorPhase + 0.3, alpha);
    ctx.lineWidth = simple ? 0.5 : 1;

    // Rear wheel
    ctx.beginPath();
    ctx.arc(rearX, bikeY, wheelR, 0, TAU);
    ctx.stroke();

    // Front wheel
    ctx.beginPath();
    ctx.arc(frontX, bikeY, wheelR, 0, TAU);
    ctx.stroke();

    if (!simple) {
      // Wheel spokes (rotating)
      const spokeAlpha = alpha * 0.5;
      ctx.strokeStyle = getGradientColor(this.colorPhase + 0.4, spokeAlpha);
      ctx.lineWidth = 0.4;
      for (let spoke = 0; spoke < 8; spoke++) {
        const a = (spoke / 8) * TAU + this.pedalAngle;
        // Rear
        ctx.beginPath();
        ctx.moveTo(rearX, bikeY);
        ctx.lineTo(rearX + Math.cos(a) * wheelR, bikeY + Math.sin(a) * wheelR);
        ctx.stroke();
        // Front
        ctx.beginPath();
        ctx.moveTo(frontX, bikeY);
        ctx.lineTo(frontX + Math.cos(a) * wheelR, bikeY + Math.sin(a) * wheelR);
        ctx.stroke();
      }
    }

    ctx.strokeStyle = getGradientColor(this.colorPhase + 0.3, alpha);
    ctx.lineWidth = simple ? 0.5 : 1.2;

    // Bottom bracket (pedal center)
    const bbX = (rearX + frontX) * 0.45;
    const bbY = bikeY;

    // Chainstay (BB to rear hub)
    ctx.beginPath();
    ctx.moveTo(bbX, bbY);
    ctx.lineTo(rearX, bikeY);
    ctx.stroke();

    // Seat tube (BB to seat)
    ctx.beginPath();
    ctx.moveTo(bbX, bbY);
    ctx.lineTo(rearX + s * 0.02, seatY);
    ctx.stroke();

    // Seat stay (rear hub to seat)
    ctx.beginPath();
    ctx.moveTo(rearX, bikeY);
    ctx.lineTo(rearX + s * 0.02, seatY);
    ctx.stroke();

    // Down tube (BB to head tube bottom)
    ctx.beginPath();
    ctx.moveTo(bbX, bbY);
    ctx.lineTo(frontX - s * 0.02, handleY + s * 0.05);
    ctx.stroke();

    // Top tube (seat to head tube)
    ctx.beginPath();
    ctx.moveTo(rearX + s * 0.02, seatY);
    ctx.lineTo(frontX - s * 0.02, handleY + s * 0.02);
    ctx.stroke();

    // Fork (head tube to front hub)
    ctx.beginPath();
    ctx.moveTo(frontX - s * 0.02, handleY + s * 0.02);
    ctx.lineTo(frontX, bikeY);
    ctx.stroke();

    // Handlebars
    ctx.beginPath();
    ctx.moveTo(frontX - s * 0.02, handleY);
    ctx.lineTo(frontX + s * 0.04, handleY - s * 0.02);
    ctx.stroke();

    // Seat
    ctx.beginPath();
    ctx.moveTo(rearX - s * 0.03, seatY - s * 0.01);
    ctx.lineTo(rearX + s * 0.07, seatY - s * 0.01);
    ctx.stroke();

    // Pedals (cranks rotating)
    if (!simple) {
      const crankLen = wheelR * 0.45;
      ctx.lineWidth = 1;
      for (let p = 0; p < 2; p++) {
        const pa = this.pedalAngle + p * Math.PI;
        const px = bbX + Math.cos(pa) * crankLen;
        const py = bbY + Math.sin(pa) * crankLen;
        ctx.strokeStyle = getGradientColor(this.colorPhase + 0.5, 0.7);
        ctx.beginPath();
        ctx.moveTo(bbX, bbY);
        ctx.lineTo(px, py);
        ctx.stroke();
        // Pedal platform
        ctx.beginPath();
        ctx.moveTo(px - 3, py);
        ctx.lineTo(px + 3, py);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // Hub dots
      ctx.fillStyle = getGradientColor(this.colorPhase + 0.3, 0.8);
      ctx.beginPath(); ctx.arc(rearX, bikeY, 2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(frontX, bikeY, 2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(bbX, bbY, 2, 0, TAU); ctx.fill();
    }
  }

  _drawBody(ctx, t) {
    const s = this.size;
    const hu = s / 7.5;
    const breath = Math.sin(this.breathPhase) * s * 0.008;

    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const frontX = s * 0.2;
    const seatY = bikeY - wheelR * 0.9;
    const handleY = bikeY - wheelR * 1.1;
    const bbX = (rearX + frontX) * 0.45;
    const bbY = bikeY;
    const crankLen = wheelR * 0.45;

    // Rider position
    const hipX = rearX + s * 0.02;
    const hipRiderY = seatY - s * 0.02;
    const torsoLean = 0.35; // leaning forward
    const shoulderX = hipX + Math.sin(torsoLean) * hu * 2.5;
    const shoulderY = hipRiderY - Math.cos(torsoLean) * hu * 2.5 + breath;
    const headX = shoulderX + Math.sin(torsoLean) * hu * 0.8;
    const headY = shoulderY - hu * 1.2;
    const headR = hu * 0.55;

    const coreAlpha = 0.8;
    ctx.strokeStyle = getGradientColor(this.colorPhase, coreAlpha);
    ctx.lineWidth = 1.2;

    // Head
    ctx.beginPath();
    ctx.arc(headX, headY, headR, 0, TAU);
    ctx.stroke();

    // Eyes
    const eyeY = headY - headR * 0.05;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.arc(headX + side * headR * 0.35, eyeY, headR * 0.1, 0, TAU);
      ctx.fillStyle = getGradientColor(this.colorPhase + 0.1, 0.9);
      ctx.fill();
    }

    // Neck
    ctx.strokeStyle = getGradientColor(this.colorPhase, coreAlpha);
    ctx.beginPath();
    ctx.moveTo(headX, headY + headR);
    ctx.lineTo(shoulderX, shoulderY);
    ctx.stroke();

    // Torso (spine line)
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(hipX, hipRiderY);
    ctx.stroke();

    // Shoulder line
    const shoulderW = hu * 0.8;
    ctx.beginPath();
    ctx.moveTo(shoulderX - shoulderW, shoulderY);
    ctx.lineTo(shoulderX + shoulderW, shoulderY);
    ctx.stroke();

    // Torso mesh wireframe
    const waistX = lerp(shoulderX, hipX, 0.6);
    const waistY = lerp(shoulderY, hipRiderY, 0.6);
    ctx.strokeStyle = getGradientColor(this.colorPhase + 0.05, 0.4);
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(shoulderX - shoulderW, shoulderY);
    ctx.lineTo(waistX + hu * 0.4, waistY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(shoulderX + shoulderW, shoulderY);
    ctx.lineTo(waistX - hu * 0.4, waistY);
    ctx.stroke();

    // Arms reaching to handlebars
    ctx.strokeStyle = getGradientColor(this.colorPhase, 0.7);
    ctx.lineWidth = 1;
    const handlebarX = frontX + s * 0.01;
    const handlebarY2 = handleY - s * 0.01;
    for (let side = -1; side <= 1; side += 2) {
      const shX = shoulderX + side * shoulderW;
      const shY = shoulderY;
      const elbowX = lerp(shX, handlebarX, 0.45) + side * hu * 0.15;
      const elbowY = lerp(shY, handlebarY2, 0.5) + hu * 0.15;

      ctx.beginPath();
      ctx.moveTo(shX, shY);
      ctx.lineTo(elbowX, elbowY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(elbowX, elbowY);
      ctx.lineTo(handlebarX + side * s * 0.015, handlebarY2);
      ctx.stroke();

      // Joint dot
      ctx.fillStyle = getGradientColor(this.colorPhase + 0.1, 0.7);
      ctx.beginPath();
      ctx.arc(elbowX, elbowY, 1.5, 0, TAU);
      ctx.fill();
    }

    // Legs pedaling
    ctx.strokeStyle = getGradientColor(this.colorPhase, 0.7);
    ctx.lineWidth = 1;
    for (let leg = 0; leg < 2; leg++) {
      const pa = this.pedalAngle + leg * Math.PI;
      const footX = bbX + Math.cos(pa) * crankLen;
      const footY = bbY + Math.sin(pa) * crankLen;

      const thighX = hipX + (leg === 0 ? hu * 0.2 : -hu * 0.1);
      const kneeX = lerp(thighX, footX, 0.5) + Math.sin(pa + 0.5) * hu * 0.2;
      const kneeY = lerp(hipRiderY, footY, 0.45) + Math.abs(Math.cos(pa)) * hu * 0.15;

      ctx.beginPath();
      ctx.moveTo(thighX, hipRiderY);
      ctx.lineTo(kneeX, kneeY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();

      // Knee dot
      ctx.fillStyle = getGradientColor(this.colorPhase + 0.1, 0.6);
      ctx.beginPath();
      ctx.arc(kneeX, kneeY, 1.5, 0, TAU);
      ctx.fill();
    }

    // Joint dots at shoulders and hips
    ctx.fillStyle = getGradientColor(this.colorPhase, 0.8);
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.arc(shoulderX + side * shoulderW, shoulderY, 1.5, 0, TAU);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(hipX, hipRiderY, 2, 0, TAU);
    ctx.fill();
  }

  _drawBodySimple(ctx, t, simple) {
    // Simplified body silhouette for trail
    const s = this.size;
    const hu = s / 7.5;
    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const seatY = bikeY - wheelR * 0.9;
    const hipX = rearX + s * 0.02;
    const hipRiderY = seatY - s * 0.02;
    const torsoLean = 0.35;
    const shoulderX = hipX + Math.sin(torsoLean) * hu * 2.5;
    const shoulderY = hipRiderY - Math.cos(torsoLean) * hu * 2.5;
    const headX = shoulderX + Math.sin(torsoLean) * hu * 0.8;
    const headY = shoulderY - hu * 1.2;

    ctx.strokeStyle = getGradientColor(this.colorPhase, 0.15);
    ctx.lineWidth = 0.5;
    // Head
    ctx.beginPath();
    ctx.arc(headX, headY, hu * 0.55, 0, TAU);
    ctx.stroke();
    // Spine
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(hipX, hipRiderY);
    ctx.stroke();
  }

  _drawDress(ctx, t) {
    const s = this.size;
    const hu = s / 7.5;
    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const seatY = bikeY - wheelR * 0.9;
    const hipX = rearX + s * 0.02;
    const hipRiderY = seatY - s * 0.02;

    // Flowing dress/skirt trailing from waist
    const skirtSegments = 10;
    const skirtLen = s * 0.25;
    const dressSpreadDir = -this.direction; // trails opposite to movement

    ctx.lineWidth = 0.8;
    for (let i = 0; i <= skirtSegments; i++) {
      const frac = i / skirtSegments;
      const sx = hipX + (frac - 0.5) * hu * 1.2;
      const spread = (frac - 0.5) * 2;
      const windOffset = dressSpreadDir * s * 0.12 * frac;
      const wave = Math.sin(t * 2.5 + frac * 4) * s * 0.015;
      const endX = sx + spread * s * 0.08 + windOffset + wave;
      const endY = hipRiderY + skirtLen + Math.sin(frac * Math.PI) * s * 0.02;

      const a = 0.35 - frac * 0.15;
      ctx.strokeStyle = getGradientColor(this.colorPhase + frac * 0.3, a);
      ctx.beginPath();
      ctx.moveTo(sx, hipRiderY);
      const cpx = (sx + endX) * 0.5 + wave + windOffset * 0.5;
      const cpy = hipRiderY + skirtLen * 0.6;
      ctx.quadraticCurveTo(cpx, cpy, endX, endY);
      ctx.stroke();
    }

    // Horizontal rings on dress
    for (let ring = 1; ring <= 2; ring++) {
      const ry = hipRiderY + (skirtLen * ring) / 3;
      const rw = hu * 0.6 + ring * hu * 0.15;
      const rx = hipX + dressSpreadDir * s * 0.04 * ring;
      ctx.strokeStyle = getGradientColor(this.colorPhase + 0.2, 0.2);
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.ellipse(rx, ry, rw, s * 0.005, 0, 0, Math.PI);
      ctx.stroke();
    }
  }

  _drawHair(ctx, t) {
    const s = this.size;
    const hu = s / 7.5;
    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const seatY = bikeY - wheelR * 0.9;
    const hipX = rearX + s * 0.02;
    const hipRiderY = seatY - s * 0.02;
    const torsoLean = 0.35;
    const shoulderX = hipX + Math.sin(torsoLean) * hu * 2.5;
    const shoulderY = hipRiderY - Math.cos(torsoLean) * hu * 2.5;
    const headX = shoulderX + Math.sin(torsoLean) * hu * 0.8;
    const headY = shoulderY - hu * 1.2;
    const headR = hu * 0.55;

    const windDir = -this.direction;

    ctx.lineWidth = 0.7;
    for (let i = 0; i < this.hairStrands.length; i++) {
      const strand = this.hairStrands[i];
      const angle = (i / this.hairStrands.length - 0.5) * Math.PI * 0.6;
      const startX = headX + Math.sin(angle) * headR * 0.8;
      const startY = headY - Math.cos(angle) * headR * 0.4;
      const len = strand.len * s;
      const wave = Math.sin(t * strand.wave + strand.phase) * s * 0.025;

      const endX = startX + windDir * len * 0.8 + wave;
      const endY = startY + len * 0.3 + Math.sin(t * 1.5 + i) * s * 0.01;

      const a = 0.4 + i * 0.03;
      ctx.strokeStyle = getGradientColor(this.colorPhase + i * 0.05, a);
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      const cpx = (startX + endX) * 0.5 + windDir * len * 0.3;
      const cpy = (startY + endY) * 0.5 - len * 0.1;
      ctx.quadraticCurveTo(cpx, cpy, endX, endY);
      ctx.stroke();
    }
  }

  _drawScanlines(ctx, t) {
    const s = this.size;
    const scanAlpha = 0.04 + Math.sin(t * 0.7) * 0.02;
    ctx.strokeStyle = getGradientColor(this.colorPhase + 0.5, scanAlpha);
    ctx.lineWidth = 0.5;

    const scroll = (t * 15) % 5;
    for (let y = -s * 0.6; y < s * 0.6; y += 5) {
      const ly = y + scroll;
      ctx.beginPath();
      ctx.moveTo(-s * 0.4, ly);
      ctx.lineTo(s * 0.4, ly);
      ctx.stroke();
    }
  }

  _drawChromatic(ctx, t) {
    // Very subtle chromatic aberration on the head only
    const s = this.size;
    const hu = s / 7.5;
    const wheelR = s * 0.18;
    const bikeY = s * 0.28;
    const rearX = -s * 0.15;
    const seatY = bikeY - wheelR * 0.9;
    const hipX = rearX + s * 0.02;
    const hipRiderY = seatY - s * 0.02;
    const torsoLean = 0.35;
    const shoulderX = hipX + Math.sin(torsoLean) * hu * 2.5;
    const shoulderY = hipRiderY - Math.cos(torsoLean) * hu * 2.5;
    const headX = shoulderX + Math.sin(torsoLean) * hu * 0.8;
    const headY = shoulderY - hu * 1.2;
    const headR = hu * 0.55;

    ctx.globalCompositeOperation = 'lighter';
    const offsets = [[-1, 0, 0], [1, 0, 1], [0, -1, 2]];
    for (const [ox, oy, ci] of offsets) {
      ctx.strokeStyle = getGradientColor(this.colorPhase + ci * 0.33, 0.06);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(headX + ox, headY + oy, headR, 0, TAU);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ─── Background ─── */
function drawBackground(ctx, t) {
  // Dark gradient sky
  const skyGrd = ctx.createLinearGradient(0, 0, 0, H);
  skyGrd.addColorStop(0, '#050510');
  skyGrd.addColorStop(0.4, '#080818');
  skyGrd.addColorStop(0.7, '#0a0a20');
  skyGrd.addColorStop(1, '#060615');
  ctx.fillStyle = skyGrd;
  ctx.fillRect(0, 0, W, H);

  // Stars
  if (!drawBackground._stars) {
    drawBackground._stars = [];
    for (let i = 0; i < 60; i++) {
      drawBackground._stars.push({
        x: rand(0, 1), y: rand(0, 0.6),
        size: rand(0.5, 1.5), phase: rand(0, TAU),
        speed: rand(0.5, 1.5),
      });
    }
  }

  for (const star of drawBackground._stars) {
    const twinkle = 0.3 + Math.sin(t * star.speed + star.phase) * 0.3;
    ctx.fillStyle = `rgba(200,220,255,${twinkle})`;
    ctx.beginPath();
    ctx.arc(star.x * W, star.y * H, star.size, 0, TAU);
    ctx.fill();
  }

  // Moon
  const moonX = W * 0.82;
  const moonY = H * 0.12;
  const moonR = 25;
  const moonGrd = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 4);
  moonGrd.addColorStop(0, 'rgba(200,220,255,0.15)');
  moonGrd.addColorStop(0.3, 'rgba(150,180,220,0.05)');
  moonGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = moonGrd;
  ctx.fillRect(moonX - moonR * 4, moonY - moonR * 4, moonR * 8, moonR * 8);
  ctx.fillStyle = 'rgba(220,230,255,0.25)';
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, TAU);
  ctx.fill();

  // Ground fog
  const fogY = H * 0.85;
  const fogGrd = ctx.createLinearGradient(0, fogY - H * 0.1, 0, H);
  fogGrd.addColorStop(0, 'rgba(0,0,0,0)');
  fogGrd.addColorStop(0.3, 'rgba(30,40,60,0.05)');
  fogGrd.addColorStop(1, 'rgba(20,30,50,0.15)');
  ctx.fillStyle = fogGrd;
  ctx.fillRect(0, fogY - H * 0.1, W, H - fogY + H * 0.1);

  // Ground line (road)
  const roadY = H * 0.78;
  ctx.strokeStyle = 'rgba(100,130,180,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, roadY);
  ctx.lineTo(W, roadY);
  ctx.stroke();

  // Wind wisps
  ctx.strokeStyle = 'rgba(100,150,200,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 3; i++) {
    const wy = H * (0.3 + i * 0.15);
    const wx = ((t * 30 + i * 200) % (W + 400)) - 200;
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.quadraticCurveTo(wx + 80, wy - 10 + Math.sin(t + i) * 5, wx + 160, wy + 5);
    ctx.stroke();
  }
}

/* ─── Scene Setup ─── */
const figureSize = Math.min(W, H) * 0.35;
const ghost = new GhostWoman(W * 0.5, H * 0.6, figureSize);

const leaves = [];
for (let i = 0; i < 15; i++) leaves.push(new WindLeaf());

const dust = [];
for (let i = 0; i < 40; i++) dust.push(new DustParticle());

/* ─── Main Loop ─── */
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;

  // Handle resize
  if (ghost.size !== Math.min(W, H) * 0.35) {
    ghost.size = Math.min(W, H) * 0.35;
    ghost.baseX = W * 0.5;
    ghost.baseY = H * 0.6;
  }

  // Clear & draw background
  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx, t);

  // Update & draw dust (behind figure)
  for (const d of dust) {
    d.update(dt);
    d.draw(ctx, t);
  }

  // Update & draw ghost woman
  ghost.update(t, dt);
  ghost.draw(ctx, t);

  // Update & draw leaves (in front)
  for (const leaf of leaves) {
    leaf.update(dt);
    leaf.draw(ctx, t);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
