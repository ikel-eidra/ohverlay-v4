<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis - Hyperrealistic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="aurora"></canvas>
<script>
const canvas = document.getElementById('aurora');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:white;text-align:center;padding:2em">WebGL not supported</p>'; }

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

/* ─── Shaders ──────────────────────────────────────────────── */

const vertSrc = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const fragSrc = `
#ifdef GL_ES
precision highp float;
#endif

uniform float uTime;
uniform vec2 uRes;

/* ── Noise functions ── */
// Hash without sin - better precision
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * .1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// Simplex-style 2D noise
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289v2(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289v2(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

// Fractal Brownian Motion
float fbm(vec2 p, int octaves) {
  float v = 0.0, a = 0.5;
  vec2 shift = vec2(100.0);
  mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    v += a * snoise(p);
    p = rot * p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

/* ── Stars ── */
float stars(vec2 uv, float t) {
  float s = 0.0;
  for (float i = 0.0; i < 4.0; i++) {
    vec2 suv = uv * (80.0 + i * 60.0);
    vec2 id = floor(suv);
    vec2 f = fract(suv) - 0.5;
    vec2 rnd = hash22(id + i * 77.7);
    vec2 offset = rnd - 0.5;
    float d = length(f - offset);
    float brightness = rnd.x;
    // Twinkle
    float twinkle = sin(t * (1.5 + rnd.y * 3.0) + rnd.x * 6.283) * 0.5 + 0.5;
    twinkle = mix(0.3, 1.0, twinkle);
    float star = smoothstep(0.05, 0.0, d) * brightness * twinkle;
    // Tiny glow around brighter stars
    star += smoothstep(0.15, 0.0, d) * brightness * twinkle * 0.15;
    s += star;
  }
  return s;
}

/* ── Aurora curtain ── */
vec3 auroraCurtain(vec2 uv, float t) {
  vec3 col = vec3(0.0);

  // Multiple curtain layers with different speeds and colors
  for (float layer = 0.0; layer < 5.0; layer++) {
    float layerOffset = layer * 0.37;
    float speed = 0.08 + layer * 0.02;
    float scale = 1.5 + layer * 0.5;

    // Curtain wave shape
    vec2 p = uv;
    p.x *= scale;
    p.x += t * speed + layerOffset;

    // Vertical displacement - the signature aurora curtain fold
    float wave1 = snoise(vec2(p.x * 0.3, t * 0.05 + layerOffset)) * 0.4;
    float wave2 = snoise(vec2(p.x * 0.7, t * 0.08 + layerOffset * 2.0)) * 0.2;
    float wave3 = snoise(vec2(p.x * 1.5, t * 0.12 + layerOffset * 3.0)) * 0.08;
    float curtainX = wave1 + wave2 + wave3;

    // Aurora band vertical position (upper portion of sky)
    float bandCenter = 0.62 + curtainX + layer * 0.04;
    float bandWidth = 0.08 + snoise(vec2(p.x * 0.5 + layerOffset, t * 0.06)) * 0.04;
    bandWidth = max(bandWidth, 0.02);

    // Vertical falloff - soft at top, slightly sharper at bottom (like real aurora)
    float dist = uv.y - bandCenter;
    float topFalloff = exp(-max(dist, 0.0) * 6.0 / bandWidth);
    float bottomFalloff = exp(-max(-dist, 0.0) * 12.0 / bandWidth);
    float band = topFalloff * bottomFalloff;

    // Streaky vertical rays
    float rays = snoise(vec2(p.x * 4.0, uv.y * 0.5 + t * 0.02)) * 0.5 + 0.5;
    rays = pow(rays, 1.5);
    float fineRays = snoise(vec2(p.x * 12.0, uv.y * 2.0 - t * 0.03)) * 0.5 + 0.5;
    fineRays = pow(fineRays, 2.0);
    rays = mix(rays, rays * fineRays, 0.5);

    // Intensity variation along the curtain
    float intensity = snoise(vec2(p.x * 0.2, t * 0.03 + layerOffset)) * 0.5 + 0.5;
    intensity = pow(intensity, 0.8);
    intensity *= 0.4 + layer * 0.05;

    // Shimmer - fast, subtle brightness changes
    float shimmer = snoise(vec2(p.x * 3.0, t * 0.5 + layerOffset)) * 0.3 + 0.7;

    // Color gradient - height-dependent like real aurora
    // Bottom: red/pink, Middle: green, Top: blue/purple
    vec3 colBottom = vec3(0.6, 0.1, 0.3);  // Deep magenta/red
    vec3 colLow    = vec3(0.2, 0.8, 0.3);  // Green (dominant aurora color)
    vec3 colMid    = vec3(0.1, 0.9, 0.5);  // Bright green-cyan
    vec3 colHigh   = vec3(0.2, 0.4, 0.9);  // Blue
    vec3 colTop    = vec3(0.5, 0.2, 0.8);  // Purple

    // Normalized height within the band
    float h = clamp((uv.y - (bandCenter - bandWidth * 3.0)) / (bandWidth * 8.0), 0.0, 1.0);

    vec3 auroraColor;
    if (h < 0.15) {
      auroraColor = mix(colBottom, colLow, h / 0.15);
    } else if (h < 0.4) {
      auroraColor = mix(colLow, colMid, (h - 0.15) / 0.25);
    } else if (h < 0.7) {
      auroraColor = mix(colMid, colHigh, (h - 0.4) / 0.3);
    } else {
      auroraColor = mix(colHigh, colTop, (h - 0.7) / 0.3);
    }

    // Per-layer color shift for variety
    float hueShift = sin(t * 0.02 + layer * 1.5) * 0.15;
    auroraColor.r += hueShift * 0.3;
    auroraColor.g += sin(hueShift * 2.0) * 0.1;
    auroraColor.b -= hueShift * 0.2;

    // Combine
    float alpha = band * rays * intensity * shimmer;
    alpha *= smoothstep(0.0, 0.3, uv.y); // Fade near horizon
    alpha *= smoothstep(1.0, 0.85, uv.y); // Fade near top

    col += auroraColor * alpha * 0.6;
  }

  return col;
}

/* ── Sky gradient ── */
vec3 skyGradient(vec2 uv, float t) {
  // Night sky - dark blue to near-black
  vec3 bottom = vec3(0.01, 0.01, 0.02);
  vec3 horizon = vec3(0.02, 0.04, 0.08);
  vec3 mid = vec3(0.01, 0.02, 0.06);
  vec3 top = vec3(0.005, 0.005, 0.02);

  vec3 col;
  if (uv.y < 0.15) {
    col = mix(bottom, horizon, uv.y / 0.15);
  } else if (uv.y < 0.5) {
    col = mix(horizon, mid, (uv.y - 0.15) / 0.35);
  } else {
    col = mix(mid, top, (uv.y - 0.5) / 0.5);
  }

  return col;
}

/* ── Terrain silhouette ── */
float terrain(float x, float t) {
  float h = 0.0;
  // Rolling hills
  h += sin(x * 1.2 + 0.5) * 0.04;
  h += sin(x * 2.7 + 1.3) * 0.025;
  h += sin(x * 5.1 + 2.1) * 0.012;
  // Treeline jagged edge
  float trees = snoise(vec2(x * 8.0, 0.0)) * 0.015;
  trees += snoise(vec2(x * 20.0, 0.0)) * 0.008;
  trees += snoise(vec2(x * 50.0, 0.0)) * 0.003;
  h += max(trees, 0.0);
  return h + 0.08;
}

/* ── Reflection on water/snow ── */
vec3 groundReflection(vec2 uv, float terrainH, vec3 auroraCol, float t) {
  if (uv.y > terrainH) return vec3(0.0);

  float depth = terrainH - uv.y;
  // Mirror the aurora from above
  vec2 mirrorUv = vec2(uv.x, terrainH + depth * 0.8);
  // Ripple distortion
  mirrorUv.x += snoise(vec2(uv.x * 10.0, t * 0.3)) * 0.005 * depth;
  mirrorUv.y += snoise(vec2(uv.x * 8.0, t * 0.2 + 5.0)) * 0.008 * depth;

  vec3 reflected = auroraCurtain(mirrorUv, t);
  // Attenuate with depth
  float atten = exp(-depth * 15.0) * 0.35;
  return reflected * atten;
}

/* ── Main ── */
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float t = uTime;
  float aspect = uRes.x / uRes.y;
  vec2 uvAspect = vec2(uv.x * aspect, uv.y);

  // Sky base
  vec3 col = skyGradient(uv, t);

  // Stars (behind aurora)
  float s = stars(uvAspect, t);
  col += vec3(0.9, 0.92, 1.0) * s * smoothstep(0.1, 0.4, uv.y);

  // Milky way hint
  float milky = fbm(uvAspect * vec2(1.0, 3.0) + vec2(0.0, 2.0), 5) * 0.5 + 0.5;
  milky = pow(milky, 3.0) * 0.04;
  float milkyBand = exp(-pow((uv.y - 0.7) * 3.0, 2.0));
  col += vec3(0.4, 0.45, 0.6) * milky * milkyBand;

  // Aurora
  vec3 aurora = auroraCurtain(uvAspect, t);
  col += aurora;

  // Atmospheric glow under aurora
  float glowY = 0.55 + snoise(vec2(t * 0.03, 0.0)) * 0.05;
  float atmoGlow = exp(-pow((uv.y - glowY) * 2.5, 2.0));
  float glowIntensity = length(aurora) * 0.3;
  vec3 glowColor = mix(vec3(0.05, 0.2, 0.1), vec3(0.1, 0.3, 0.15), uv.y);
  col += glowColor * atmoGlow * glowIntensity;

  // Terrain
  float th = terrain(uvAspect.x, t);
  float terrainMask = smoothstep(th + 0.003, th - 0.002, uv.y);

  // Ground reflection (frozen lake / snow)
  vec3 reflection = groundReflection(uvAspect, th, aurora, t);
  vec3 groundCol = vec3(0.005, 0.008, 0.015); // Very dark ground
  groundCol += reflection;
  // Faint snow illumination from aurora
  groundCol += aurora * 0.02 * exp(-(th - uv.y) * 20.0);

  col = mix(col, groundCol, terrainMask);

  // Terrain edge highlight (snow/frost catching aurora light)
  float edgeGlow = smoothstep(0.005, 0.0, abs(uv.y - th));
  col += (aurora * 0.3 + vec3(0.03, 0.05, 0.08)) * edgeGlow;

  // Post-processing
  // Vignette
  vec2 vig = uv * (1.0 - uv);
  float vigAmount = pow(vig.x * vig.y * 20.0, 0.3);
  col *= vigAmount;

  // Subtle film grain
  float grain = hash12(uv * uRes + fract(t) * 1000.0) * 0.015 - 0.0075;
  col += grain;

  // Tone mapping (ACES approximation)
  col = col * (2.51 * col + 0.03) / (col * (2.43 * col + 0.59) + 0.14);

  // Gamma
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));

  gl_FragColor = vec4(col, 1.0);
}
`;

/* ─── WebGL setup ──────────────────────────────────────────── */

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const vs = createShader(gl.VERTEX_SHADER, vertSrc);
const fs = createShader(gl.FRAGMENT_SHADER, fragSrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'uTime');
const uRes = gl.getUniformLocation(prog, 'uRes');

/* ─── Render loop ──────────────────────────────────────────── */
const startTime = performance.now();

function frame() {
  const t = (performance.now() - startTime) * 0.001;
  gl.uniform1f(uTime, t);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
