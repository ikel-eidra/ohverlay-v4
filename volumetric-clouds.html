<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Volumetric Clouds — Black Screen</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: none;
    }

    html.overlay,
    html.overlay body,
    html.overlay canvas {
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="Slow volumetric clouds crossing the upper part of a pitch-black screen"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('sky');
      const BLACK = '#000000';
      let width = 1;
      let height = 1;
      let paused = false;
      let elapsed = 0;
      let lastTime = performance.now();
      let gust = 0;
      let mode = 'webgl';
      let overlayMode = true;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }
      const wakeSegments = Array.from({ length: 4 }, () => ({
        ax: -2,
        ay: -2,
        bx: -2,
        by: -2,
        strength: 0,
        age: 99
      }));
      const pointer = {
        x: -2,
        y: -2,
        active: false,
        down: false,
        lastEventTime: performance.now()
      };

      const gl = canvas.getContext('webgl2', {
        alpha: true,
        premultipliedAlpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      });

      const vertexSource = `#version 300 es
        precision highp float;
        out vec2 vUv;

        void main() {
          vec2 position;
          if (gl_VertexID == 0) position = vec2(-1.0, -1.0);
          else if (gl_VertexID == 1) position = vec2(3.0, -1.0);
          else position = vec2(-1.0, 3.0);
          vUv = position * 0.5 + 0.5;
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `;

      const fragmentSource = `#version 300 es
        precision highp float;

        in vec2 vUv;
        out vec4 fragColor;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uWind;
        uniform vec4 uTrail0;
        uniform vec4 uTrail1;
        uniform vec4 uTrail2;
        uniform vec4 uTrail3;
        uniform vec4 uTrailStrengths;
        uniform float uOverlay;

        float segmentDistance(vec2 point, vec2 start, vec2 end, float aspect) {
          point.x *= aspect;
          start.x *= aspect;
          end.x *= aspect;
          vec2 line = end - start;
          float amount = clamp(dot(point - start, line) / max(dot(line, line), 0.000001), 0.0, 1.0);
          return length(point - (start + line * amount));
        }

        float trailField(vec2 uv, vec4 trail, float strength, float aspect) {
          float distanceToTrail = segmentDistance(uv, trail.xy, trail.zw, aspect);
          return exp(-distanceToTrail * distanceToTrail * 1450.0) * strength;
        }

        float wakeField(vec2 uv) {
          float aspect = uResolution.x / max(1.0, uResolution.y);
          float field = 0.0;
          field = max(field, trailField(uv, uTrail0, uTrailStrengths.x, aspect));
          field = max(field, trailField(uv, uTrail1, uTrailStrengths.y, aspect));
          field = max(field, trailField(uv, uTrail2, uTrailStrengths.z, aspect));
          field = max(field, trailField(uv, uTrail3, uTrailStrengths.w, aspect));
          return clamp(field, 0.0, 1.25);
        }

        float hash31(vec3 p) {
          p = fract(p * 0.1031);
          p += dot(p, p.yzx + 33.33);
          return fract((p.x + p.y) * p.z);
        }

        float valueNoise(vec3 p) {
          vec3 cell = floor(p);
          vec3 local = fract(p);
          local = local * local * (3.0 - 2.0 * local);

          float n000 = hash31(cell + vec3(0.0, 0.0, 0.0));
          float n100 = hash31(cell + vec3(1.0, 0.0, 0.0));
          float n010 = hash31(cell + vec3(0.0, 1.0, 0.0));
          float n110 = hash31(cell + vec3(1.0, 1.0, 0.0));
          float n001 = hash31(cell + vec3(0.0, 0.0, 1.0));
          float n101 = hash31(cell + vec3(1.0, 0.0, 1.0));
          float n011 = hash31(cell + vec3(0.0, 1.0, 1.0));
          float n111 = hash31(cell + vec3(1.0, 1.0, 1.0));

          float nx00 = mix(n000, n100, local.x);
          float nx10 = mix(n010, n110, local.x);
          float nx01 = mix(n001, n101, local.x);
          float nx11 = mix(n011, n111, local.x);
          float nxy0 = mix(nx00, nx10, local.y);
          float nxy1 = mix(nx01, nx11, local.y);
          return mix(nxy0, nxy1, local.z);
        }

        float fbm(vec3 p) {
          float sum = 0.0;
          float amplitude = 0.53;
          mat3 rotation = mat3(
             0.00,  0.80,  0.60,
            -0.80,  0.36, -0.48,
            -0.60, -0.48,  0.64
          );
          for (int octave = 0; octave < 5; octave++) {
            sum += valueNoise(p) * amplitude;
            p = rotation * p * 2.03 + vec3(13.1, 7.7, 5.3);
            amplitude *= 0.51;
          }
          return sum;
        }

        float densityField(vec3 p, vec2 screenUv, float wake) {
          float drift = uTime * (0.042 + uWind * 0.020);
          float wakeEdge = 4.0 * clamp(wake, 0.0, 1.0) * (1.0 - clamp(wake, 0.0, 1.0));
          p.x += sin(p.z * 5.2 + uTime * 1.7 + screenUv.y * 19.0) * wakeEdge * 0.18;
          p.y += cos(p.z * 4.4 - uTime * 1.3 + screenUv.x * 17.0) * wakeEdge * 0.24;
          vec3 macroPoint = vec3(
            p.x * 0.43 - drift,
            p.y * 0.76,
            p.z * 0.38 + uTime * 0.006
          );
          float macro = fbm(macroPoint);

          vec3 detailPoint = vec3(
            p.x * 1.42 - drift * 1.7,
            p.y * 1.56 + uTime * 0.010,
            p.z * 1.08
          );
          float detail = fbm(detailPoint);

          // Soft cloud deck centered high in frame, with broken banks rather
          // than a continuous fog strip.
          float verticalCore = exp(-pow((p.y - 0.28) * 0.90, 2.0));
          float upperFade = 1.0 - smoothstep(0.80, 1.85, p.y);
          float lowerFade = smoothstep(-1.18, -0.28, p.y);
          float deck = verticalCore * upperFade * lowerFade;
          float bankBreakup = smoothstep(0.43, 0.72, macro + deck * 0.31);
          float sculpted = macro * 0.68 + detail * 0.30 + deck * 0.26 - 0.64;
          float density = max(0.0, sculpted) * bankBreakup * 2.15;

          // Absolute protection of the lower screen: cloud density dissolves
          // naturally before the middle, leaving the rest pitch black.
          density *= smoothstep(0.52, 0.67, screenUv.y);
          density *= 1.0 - clamp(wake, 0.0, 1.0) * 0.93;
          density += wakeEdge * max(0.0, detail - 0.48) * 0.16;
          return density;
        }

        void main() {
          vec2 uv = vUv;
          if (uv.y < 0.50) {
            fragColor = uOverlay > 0.5
              ? vec4(0.0)
              : vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }

          float aspect = uResolution.x / max(1.0, uResolution.y);
          vec2 plane = (uv - vec2(0.5, 0.76)) * vec2(aspect * 5.2, 5.2);
          float wake = wakeField(uv);

          vec3 accumulated = vec3(0.0);
          float transmittance = 1.0;
          const int STEPS = 38;
          const float STEP_SIZE = 0.105;
          vec3 lightDirection = normalize(vec3(-0.78, 0.62, -0.44));

          // March through a genuine three-dimensional density field. Fine
          // variation in step start removes flat contour bands and reveals depth.
          float jitter = hash31(vec3(gl_FragCoord.xy, floor(uTime * 12.0))) * STEP_SIZE;
          for (int i = 0; i < STEPS; i++) {
            float z = -1.75 + float(i) * STEP_SIZE + jitter;
            vec3 point = vec3(plane, z);
            float density = densityField(point, uv, wake);

            if (density > 0.003) {
              float towardLight = densityField(point + lightDirection * 0.16, uv, wake);
              float shadow = clamp((towardLight - density) * 3.2, -0.18, 0.62);
              float edgeLight = clamp(0.70 - density * 1.6 - shadow, 0.12, 0.92);
              float silver = clamp((density - towardLight) * 4.0 + 0.26, 0.0, 0.68);

              vec3 shadowColor = vec3(0.105, 0.118, 0.137);
              vec3 bodyColor = vec3(0.58, 0.62, 0.68);
              vec3 highlightColor = vec3(0.94, 0.96, 1.00);
              vec3 sampleColor = mix(shadowColor, bodyColor, edgeLight);
              sampleColor = mix(sampleColor, highlightColor, silver);

              float opacity = 1.0 - exp(-density * STEP_SIZE * 1.72);
              accumulated += transmittance * sampleColor * opacity;
              transmittance *= 1.0 - opacity;
              if (transmittance < 0.018) break;
            }
          }

          // A tiny amount of subpixel dither keeps dim smoke-like edges smooth.
          float dither = (hash31(vec3(gl_FragCoord.xy, uTime)) - 0.5) / 255.0;
          accumulated += dither;
          float cloudAlpha = clamp(1.0 - transmittance, 0.0, 1.0);
          if (uOverlay > 0.5) {
            vec3 straightColor = cloudAlpha > 0.001
              ? max(accumulated, vec3(0.0)) / cloudAlpha
              : vec3(0.0);
            fragColor = vec4(straightColor, cloudAlpha * 0.86);
          } else {
            fragColor = vec4(max(accumulated, vec3(0.0)), 1.0);
          }
        }
      `;

      let program = null;
      let timeLocation = null;
      let resolutionLocation = null;
      let windLocation = null;
      let trailLocations = [];
      let trailStrengthsLocation = null;
      let overlayLocation = null;
      let fallback = null;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader) || 'Shader compilation failed';
          gl.deleteShader(shader);
          throw new Error(message);
        }
        return shader;
      }

      function initializeWebGL() {
        if (!gl) return false;
        try {
          const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
          const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
          program = gl.createProgram();
          gl.attachShader(program, vertex);
          gl.attachShader(program, fragment);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program) || 'Program link failed');
          }
          gl.deleteShader(vertex);
          gl.deleteShader(fragment);
          gl.useProgram(program);
          timeLocation = gl.getUniformLocation(program, 'uTime');
          resolutionLocation = gl.getUniformLocation(program, 'uResolution');
          windLocation = gl.getUniformLocation(program, 'uWind');
          trailLocations = [0, 1, 2, 3].map(index =>
            gl.getUniformLocation(program, 'uTrail' + index)
          );
          trailStrengthsLocation = gl.getUniformLocation(program, 'uTrailStrengths');
          overlayLocation = gl.getUniformLocation(program, 'uOverlay');
          gl.clearColor(0, 0, 0, 1);
          return true;
        } catch (error) {
          console.warn('Volumetric shader unavailable; using particle fallback.', error);
          return false;
        }
      }

      function seeded(index, salt = 0) {
        const value = Math.sin(index * 127.1 + salt * 311.7) * 43758.5453123;
        return value - Math.floor(value);
      }

      function makeSoftSprite(context, size, inner, outer) {
        const sprite = document.createElement('canvas');
        sprite.width = size;
        sprite.height = size;
        const spriteContext = sprite.getContext('2d');
        const gradient = spriteContext.createRadialGradient(
          size * 0.45,
          size * 0.40,
          size * 0.02,
          size * 0.5,
          size * 0.5,
          size * 0.5
        );
        gradient.addColorStop(0, inner);
        gradient.addColorStop(0.34, inner);
        gradient.addColorStop(0.72, outer);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        spriteContext.fillStyle = gradient;
        spriteContext.fillRect(0, 0, size, size);
        return sprite;
      }

      function initializeFallback() {
        mode = 'particles';
        const context = canvas.getContext('2d', { alpha: true });
        const particles = [];
        const clusters = [];
        for (let clusterIndex = 0; clusterIndex < 5; clusterIndex++) {
          clusters.push({
            x: seeded(clusterIndex, 1),
            y: 0.08 + seeded(clusterIndex, 2) * 0.21,
            width: 0.20 + seeded(clusterIndex, 3) * 0.18,
            height: 0.065 + seeded(clusterIndex, 4) * 0.075,
            speed: 0.0020 + seeded(clusterIndex, 5) * 0.0028,
            phase: seeded(clusterIndex, 6) * Math.PI * 2
          });
        }

        for (let i = 0; i < 520; i++) {
          const cluster = i % clusters.length;
          const angle = seeded(i, 10) * Math.PI * 2;
          const radius = Math.sqrt(seeded(i, 11));
          particles.push({
            cluster,
            ox: Math.cos(angle) * radius,
            oy: Math.sin(angle) * radius,
            depth: seeded(i, 12),
            radius: 0.45 + seeded(i, 13) * 0.90,
            opacity: 0.025 + seeded(i, 14) * 0.075,
            phase: seeded(i, 15) * Math.PI * 2
          });
        }

        fallback = {
          context,
          clusters,
          particles,
          shadowSprite: makeSoftSprite(context, 128, 'rgba(76,85,98,0.72)', 'rgba(15,18,25,0.14)'),
          bodySprite: makeSoftSprite(context, 128, 'rgba(228,234,242,0.88)', 'rgba(94,104,119,0.12)')
        };
      }

      function setOverlayMode(enabled) {
        overlayMode = Boolean(enabled);
        document.documentElement.classList.toggle('overlay', overlayMode);
      }

      function addWakeSegment(ax, ay, bx, by, strength) {
        const recycled = wakeSegments.pop();
        recycled.ax = ax;
        recycled.ay = ay;
        recycled.bx = bx;
        recycled.by = by;
        recycled.strength = clamp(strength, 0, 1.25);
        recycled.age = 0;
        wakeSegments.unshift(recycled);
      }

      function pointToSegmentDistance(px, py, segment) {
        const aspect = canvas.width / Math.max(1, canvas.height);
        const pax = px * aspect;
        const sax = segment.ax * aspect;
        const sbx = segment.bx * aspect;
        const lineX = sbx - sax;
        const lineY = segment.by - segment.ay;
        const lengthSquared = lineX * lineX + lineY * lineY;
        const amount = clamp(
          ((pax - sax) * lineX + (py - segment.ay) * lineY) /
            Math.max(0.000001, lengthSquared),
          0,
          1
        );
        return Math.hypot(
          pax - (sax + lineX * amount),
          py - (segment.ay + lineY * amount)
        );
      }

      function resize() {
        width = Math.max(1, innerWidth);
        height = Math.max(1, innerHeight);

        // Clouds tolerate soft upscaling; capped internal resolution preserves
        // enough ray-march steps for volume instead of spending them on pixels.
        const dpr = Math.min(devicePixelRatio || 1, 1.5);
        const resolutionScale = Math.min(1, 1500 / Math.max(width, 1));
        canvas.width = Math.round(width * dpr * resolutionScale);
        canvas.height = Math.round(height * dpr * resolutionScale);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        if (mode === 'webgl' && gl) {
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
      }

      function renderWebGL() {
        gl.useProgram(program);
        gl.uniform1f(timeLocation, elapsed);
        gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
        gl.uniform1f(windLocation, gust);
        for (let i = 0; i < 4; i++) {
          const trail = wakeSegments[i];
          gl.uniform4f(
            trailLocations[i],
            trail.ax,
            trail.ay,
            trail.bx,
            trail.by
          );
        }
        gl.uniform4f(
          trailStrengthsLocation,
          wakeSegments[0].strength,
          wakeSegments[1].strength,
          wakeSegments[2].strength,
          wakeSegments[3].strength
        );
        gl.uniform1f(overlayLocation, overlayMode ? 1 : 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function renderFallback() {
        const { context, clusters, particles, shadowSprite, bodySprite } = fallback;
        context.setTransform(1, 0, 0, 1, 0, 0);
        if (overlayMode) {
          context.clearRect(0, 0, canvas.width, canvas.height);
        } else {
          context.fillStyle = BLACK;
          context.fillRect(0, 0, canvas.width, canvas.height);
        }
        context.globalCompositeOperation = 'screen';

        const scaleX = canvas.width;
        const scaleY = canvas.height;
        for (const particle of particles) {
          const cluster = clusters[particle.cluster];
          const travel = (cluster.x + elapsed * cluster.speed * (1 + gust * 0.45)) % 1.35 - 0.18;
          const breathing = 1 + Math.sin(elapsed * 0.18 + particle.phase) * 0.035;
          let x = (travel + particle.ox * cluster.width * 0.52) * scaleX;
          let y = (cluster.y + particle.oy * cluster.height * 0.58) * scaleY;
          let wake = 0;
          let wakeShiftX = 0;
          let wakeShiftY = 0;
          for (const segment of wakeSegments) {
            if (segment.strength < 0.002) continue;
            const distance = pointToSegmentDistance(x / scaleX, 1 - y / scaleY, segment);
            const influence = Math.exp(-distance * distance * 1450) * segment.strength;
            wake = Math.max(wake, influence);
            const lineX = segment.bx - segment.ax;
            const lineY = segment.by - segment.ay;
            wakeShiftX +=
              (lineX * scaleX * 0.10 + Math.sin(particle.phase + elapsed * 2.2) * 12) *
              influence;
            wakeShiftY +=
              (-lineY * scaleY * 0.10 + Math.cos(particle.phase + elapsed * 1.8) * 9) *
              influence;
          }
          x += wakeShiftX;
          y += wakeShiftY;
          const size =
            Math.min(scaleX, scaleY) *
            cluster.height *
            particle.radius *
            breathing *
            (0.72 + particle.depth * 0.55);
          const sprite = particle.depth < 0.42 ? shadowSprite : bodySprite;
          context.globalAlpha =
            particle.opacity *
            (0.72 + particle.depth * 0.45) *
            (1 - clamp(wake, 0, 1) * 0.88);
          context.drawImage(sprite, x - size, y - size * 0.58, size * 2, size * 1.34);
        }
        context.globalAlpha = 1;
        context.globalCompositeOperation = 'source-over';
      }

      function reset() {
        elapsed = 0;
        gust = 0;
        for (const segment of wakeSegments) {
          segment.strength = 0;
          segment.age = 99;
        }
      }

      function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        if (!paused) {
          elapsed += dt * (1 + gust * 0.18);
          gust *= Math.exp(-0.72 * dt);
          for (const segment of wakeSegments) {
            segment.age += dt;
            segment.strength *= Math.exp(-(0.48 + segment.age * 0.055) * dt);
            if (segment.strength < 0.001) segment.strength = 0;
          }
        }

        if (mode === 'webgl') renderWebGL();
        else renderFallback();
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (event.code === 'Space') {
          paused = !paused;
          event.preventDefault();
        } else if (key === 'g') {
          gust = Math.max(gust, 1.35);
        } else if (key === 'r') {
          reset();
        } else if (key === 'f') {
          document.documentElement.requestFullscreen?.();
        } else if (key === 'o') {
          setOverlayMode(!overlayMode);
        }
      });

      function pointerCoordinates(event) {
        return {
          x: clamp(event.clientX / Math.max(1, width), 0, 1),
          y: clamp(1 - event.clientY / Math.max(1, height), 0, 1)
        };
      }

      function movePointer(event) {
        const coordinates = pointerCoordinates(event);
        const now = performance.now();
        const dt = clamp((now - pointer.lastEventTime) / 1000, 0.008, 0.10);
        if (pointer.active) {
          const aspect = width / Math.max(1, height);
          const distance = Math.hypot(
            (coordinates.x - pointer.x) * aspect,
            coordinates.y - pointer.y
          );
          if (distance > 0.0015) {
            const speed = distance / dt;
            const strength = clamp(
              0.18 + speed * 0.42 + (pointer.down ? 0.24 : 0),
              0.18,
              1.25
            );
            addWakeSegment(
              pointer.x,
              pointer.y,
              coordinates.x,
              coordinates.y,
              strength
            );
          }
        }
        pointer.x = coordinates.x;
        pointer.y = coordinates.y;
        pointer.active = true;
        pointer.lastEventTime = now;
      }

      addEventListener('pointermove', event => {
        movePointer(event);
      }, { passive: true });

      addEventListener('pointerdown', event => {
        movePointer(event);
        pointer.down = true;
        canvas.setPointerCapture?.(event.pointerId);
        addWakeSegment(
          pointer.x - 0.018,
          pointer.y,
          pointer.x + 0.018,
          pointer.y,
          0.88
        );
      }, { passive: true });

      addEventListener('pointerup', event => {
        movePointer(event);
        pointer.down = false;
        canvas.releasePointerCapture?.(event.pointerId);
      }, { passive: true });

      addEventListener('pointercancel', () => {
        pointer.down = false;
        pointer.active = false;
      }, { passive: true });

      addEventListener('pointerleave', event => {
        if (event.pointerType === 'mouse' && !pointer.down) pointer.active = false;
      }, { passive: true });

      if (!initializeWebGL()) initializeFallback();
      setOverlayMode(overlayMode);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
