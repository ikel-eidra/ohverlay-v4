<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Fairy & Dandelion Seeds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ─── Utilities ─── */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

/* ─── Color palette ─── */
const palette = {
  fairyCore: 'rgba(180,220,255,',      // ice blue
  fairyGlow: 'rgba(140,200,255,',       // soft blue glow
  wingMain:  'rgba(200,170,255,',       // lavender
  wingEdge:  'rgba(255,200,230,',       // pink
  seedStem:  'rgba(255,255,240,',       // warm white
  seedFluff: 'rgba(255,240,200,',       // golden
  particle:  'rgba(180,255,220,',       // mint sparkle
  firefly:   'rgba(255,230,140,',       // warm yellow
};

/* ─── Dandelion Seeds ─── */
class DandelionSeed {
  constructor() { this.reset(); }

  reset() {
    this.x = rand(-50, W + 50);
    this.y = rand(H * 0.3, H + 50);
    this.vx = rand(-0.3, 0.5);
    this.vy = rand(-0.8, -0.2);
    this.size = rand(8, 18);
    this.filaments = Math.floor(rand(8, 16));
    this.rotation = rand(0, TAU);
    this.rotSpeed = rand(-0.01, 0.01);
    this.wobblePhase = rand(0, TAU);
    this.wobbleSpeed = rand(0.5, 1.5);
    this.wobbleAmp = rand(0.3, 0.8);
    this.alpha = rand(0.3, 0.7);
    this.life = 1.0;
    this.decay = rand(0.0003, 0.001);
  }

  update(t) {
    this.wobblePhase += this.wobbleSpeed * 0.016;
    this.x += this.vx + Math.sin(this.wobblePhase) * this.wobbleAmp;
    this.y += this.vy + Math.cos(this.wobblePhase * 0.7) * 0.15;
    this.rotation += this.rotSpeed;
    this.life -= this.decay;

    if (this.life <= 0 || this.y < -50 || this.x < -100 || this.x > W + 100) {
      this.reset();
      this.y = H + rand(10, 50);
    }
  }

  draw(ctx, t) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    const a = this.alpha * this.life;

    // Central seed body (tiny teardrop)
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size * 0.08, this.size * 0.15, 0, 0, TAU);
    ctx.fillStyle = palette.seedStem + (a * 0.8) + ')';
    ctx.fill();

    // Pappus filaments (the fluffy part)
    for (let i = 0; i < this.filaments; i++) {
      const angle = (i / this.filaments) * TAU + Math.sin(t * 0.5 + i) * 0.1;
      const len = this.size * (0.7 + Math.sin(t * 0.8 + i * 2.3) * 0.15);

      ctx.beginPath();
      ctx.moveTo(0, 0);

      // Curved filament
      const cx = Math.cos(angle) * len * 0.5 + Math.sin(t + i) * 1.5;
      const cy = Math.sin(angle) * len * 0.5 + Math.cos(t * 0.7 + i) * 1.5;
      const ex = Math.cos(angle) * len;
      const ey = Math.sin(angle) * len;

      ctx.quadraticCurveTo(cx, cy, ex, ey);
      ctx.strokeStyle = palette.seedFluff + (a * 0.5) + ')';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Tiny barb at tip
      const barbLen = this.size * 0.15;
      for (let b = -1; b <= 1; b += 2) {
        const barbAngle = angle + b * 0.4;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(
          ex + Math.cos(barbAngle) * barbLen,
          ey + Math.sin(barbAngle) * barbLen
        );
        ctx.strokeStyle = palette.seedFluff + (a * 0.3) + ')';
        ctx.lineWidth = 0.3;
        ctx.stroke();
      }

      // Glow dot at tip
      ctx.beginPath();
      ctx.arc(ex, ey, 1, 0, TAU);
      ctx.fillStyle = palette.seedFluff + (a * 0.6) + ')';
      ctx.fill();
    }

    ctx.restore();
  }
}

/* ─── Wireframe Fairy ─── */
class WireframeFairy {
  constructor(x, y, size) {
    this.baseX = x;
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.size = size;
    this.breathPhase = 0;
    this.hoverPhase = rand(0, TAU);
    this.wingPhase = 0;
    this.sparkles = [];
    this.trail = [];

    for (let i = 0; i < 40; i++) {
      this.sparkles.push({
        angle: rand(0, TAU),
        dist: rand(0.5, 2.5),
        speed: rand(0.3, 1.2),
        size: rand(0.5, 2),
        phase: rand(0, TAU),
        brightness: rand(0.3, 1),
      });
    }
  }

  update(t) {
    this.breathPhase = t * 1.2;
    this.hoverPhase += 0.02;
    this.wingPhase = t * 4.5;

    // Gentle floating motion
    this.x = this.baseX + Math.sin(this.hoverPhase * 0.7) * 30 + Math.sin(this.hoverPhase * 0.3) * 15;
    this.y = this.baseY + Math.sin(this.hoverPhase) * 20 + Math.cos(this.hoverPhase * 0.5) * 10;

    // Trail
    this.trail.push({ x: this.x, y: this.y + this.size * 0.8, alpha: 1.0 });
    if (this.trail.length > 30) this.trail.shift();
    for (const p of this.trail) p.alpha *= 0.95;
  }

  drawBody(ctx, t) {
    const s = this.size;
    const breathOffset = Math.sin(this.breathPhase) * s * 0.02;

    ctx.save();
    ctx.translate(this.x, this.y);

    // ── Body wireframe ──
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = palette.fairyCore + '0.8)';

    // Head (circle with cross-lines)
    const headR = s * 0.12;
    const headY = -s * 0.42;
    ctx.beginPath();
    ctx.arc(0, headY, headR, 0, TAU);
    ctx.stroke();

    // Face details - subtle wireframe eyes
    const eyeY = headY - headR * 0.1;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.arc(side * headR * 0.4, eyeY, headR * 0.12, 0, TAU);
      ctx.fillStyle = palette.fairyGlow + '0.9)';
      ctx.fill();
    }

    // Neck
    ctx.beginPath();
    ctx.moveTo(0, headY + headR);
    ctx.lineTo(0, -s * 0.28);
    ctx.stroke();

    // Torso - wireframe triangulated mesh
    const shoulderW = s * 0.18;
    const shoulderY = -s * 0.28 + breathOffset;
    const waistW = s * 0.1;
    const waistY = -s * 0.05 + breathOffset;
    const hipW = s * 0.14;
    const hipY = s * 0.08 + breathOffset;

    // Shoulder line
    ctx.beginPath();
    ctx.moveTo(-shoulderW, shoulderY);
    ctx.lineTo(shoulderW, shoulderY);
    ctx.stroke();

    // Torso outline
    ctx.beginPath();
    ctx.moveTo(-shoulderW, shoulderY);
    ctx.lineTo(-waistW, waistY);
    ctx.lineTo(-hipW, hipY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(shoulderW, shoulderY);
    ctx.lineTo(waistW, waistY);
    ctx.lineTo(hipW, hipY);
    ctx.stroke();

    // Cross braces (wireframe mesh look)
    ctx.strokeStyle = palette.fairyCore + '0.4)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(-shoulderW, shoulderY);
    ctx.lineTo(waistW, waistY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(shoulderW, shoulderY);
    ctx.lineTo(-waistW, waistY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-waistW, waistY);
    ctx.lineTo(hipW, hipY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(waistW, waistY);
    ctx.lineTo(-hipW, hipY);
    ctx.stroke();

    // Waist line
    ctx.strokeStyle = palette.fairyCore + '0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-waistW, waistY);
    ctx.lineTo(waistW, waistY);
    ctx.stroke();

    // Hip line
    ctx.beginPath();
    ctx.moveTo(-hipW, hipY);
    ctx.lineTo(hipW, hipY);
    ctx.stroke();

    // ── Skirt (flowing wireframe) ──
    ctx.strokeStyle = palette.wingMain + '0.5)';
    ctx.lineWidth = 0.8;
    const skirtSegments = 12;
    const skirtLen = s * 0.45;
    for (let i = 0; i <= skirtSegments; i++) {
      const frac = i / skirtSegments;
      const sx = lerp(-hipW, hipW, frac);
      const spread = (frac - 0.5) * 2;
      const endX = sx + spread * s * 0.3;
      const wave = Math.sin(t * 2 + frac * 5) * s * 0.03;
      const endY = hipY + skirtLen + Math.sin(frac * Math.PI) * s * 0.05 + wave;

      ctx.beginPath();
      ctx.moveTo(sx, hipY);
      const cpx = (sx + endX) * 0.5 + wave;
      const cpy = hipY + skirtLen * 0.6;
      ctx.quadraticCurveTo(cpx, cpy, endX, endY);
      ctx.stroke();
    }

    // Horizontal rings on skirt
    for (let ring = 1; ring <= 3; ring++) {
      const ry = hipY + (skirtLen * ring) / 4;
      const rw = hipW + (s * 0.3 * ring) / 4;
      ctx.beginPath();
      ctx.ellipse(0, ry, rw, s * 0.01, 0, 0, Math.PI);
      ctx.strokeStyle = palette.wingMain + '0.3)';
      ctx.stroke();
    }

    // ── Arms ──
    ctx.strokeStyle = palette.fairyCore + '0.7)';
    ctx.lineWidth = 1;
    for (let side = -1; side <= 1; side += 2) {
      const armAngle = Math.sin(t * 0.8 + side * 0.5) * 0.2 - 0.3;
      const elbowX = side * (shoulderW + s * 0.12);
      const elbowY = shoulderY + s * 0.12;
      const handX = elbowX + side * s * 0.1 + Math.sin(t * 1.2 + side) * s * 0.03;
      const handY = elbowY + s * 0.14 + armAngle * s * 0.1;

      // Upper arm
      ctx.beginPath();
      ctx.moveTo(side * shoulderW, shoulderY);
      ctx.lineTo(elbowX, elbowY);
      ctx.stroke();

      // Forearm
      ctx.beginPath();
      ctx.moveTo(elbowX, elbowY);
      ctx.lineTo(handX, handY);
      ctx.stroke();

      // Joint dots
      ctx.beginPath();
      ctx.arc(elbowX, elbowY, 1.5, 0, TAU);
      ctx.fillStyle = palette.fairyGlow + '0.8)';
      ctx.fill();

      // Hand (small wireframe)
      ctx.beginPath();
      ctx.arc(handX, handY, 2, 0, TAU);
      ctx.stroke();

      // Fingers hint
      for (let f = -1; f <= 1; f++) {
        ctx.beginPath();
        ctx.moveTo(handX, handY);
        ctx.lineTo(handX + side * 3, handY + f * 2 + 2);
        ctx.strokeStyle = palette.fairyCore + '0.4)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      ctx.strokeStyle = palette.fairyCore + '0.7)';
    }

    // ── Legs (peeking from skirt) ──
    const legY = hipY + s * 0.4;
    for (let side = -1; side <= 1; side += 2) {
      const footX = side * s * 0.08 + Math.sin(t * 0.6 + side * 2) * 3;
      const footY = hipY + s * 0.55;
      ctx.strokeStyle = palette.fairyCore + '0.4)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(side * hipW * 0.5, legY);
      ctx.lineTo(footX, footY);
      ctx.stroke();

      // Pointed toe
      ctx.beginPath();
      ctx.moveTo(footX, footY);
      ctx.lineTo(footX + side * 5, footY + 2);
      ctx.stroke();
    }

    // ── Crown / tiara ──
    ctx.strokeStyle = palette.wingEdge + '0.7)';
    ctx.lineWidth = 0.8;
    const crownY = headY - headR;
    for (let i = -2; i <= 2; i++) {
      const cx = i * headR * 0.35;
      const tipY = crownY - (3 - Math.abs(i)) * s * 0.03;
      ctx.beginPath();
      ctx.moveTo(cx - headR * 0.15, crownY);
      ctx.lineTo(cx, tipY);
      ctx.lineTo(cx + headR * 0.15, crownY);
      ctx.stroke();

      // Gem at tip
      ctx.beginPath();
      ctx.arc(cx, tipY, 1, 0, TAU);
      ctx.fillStyle = palette.particle + '0.8)';
      ctx.fill();
    }

    // ── Core glow ──
    const grd = ctx.createRadialGradient(0, -s * 0.1, 0, 0, -s * 0.1, s * 0.6);
    grd.addColorStop(0, 'rgba(180,220,255,0.08)');
    grd.addColorStop(0.5, 'rgba(140,180,255,0.03)');
    grd.addColorStop(1, 'rgba(100,150,255,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-s, -s, s * 2, s * 2);

    ctx.restore();
  }

  drawWings(ctx, t) {
    const s = this.size;
    const wingFlap = Math.sin(this.wingPhase) * 0.3 + 0.15;
    const wingFlap2 = Math.sin(this.wingPhase * 1.3 + 0.5) * 0.2;

    ctx.save();
    ctx.translate(this.x, this.y - s * 0.15);

    for (let side = -1; side <= 1; side += 2) {
      ctx.save();
      ctx.scale(side, 1);

      // ── Upper wing ──
      const uwScaleX = 0.7 + wingFlap * 0.5;
      ctx.save();
      ctx.scale(uwScaleX, 1);

      // Wing outline
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.1);
      ctx.bezierCurveTo(
        s * 0.3, -s * 0.5,
        s * 0.7, -s * 0.45,
        s * 0.55, -s * 0.05
      );
      ctx.bezierCurveTo(
        s * 0.45, s * 0.05,
        s * 0.15, s * 0.02,
        0, s * 0.05
      );
      ctx.closePath();

      // Wing fill (transparent with gradient)
      const wingGrd = ctx.createLinearGradient(0, -s * 0.4, s * 0.5, 0);
      wingGrd.addColorStop(0, 'rgba(200,170,255,0.06)');
      wingGrd.addColorStop(0.5, 'rgba(180,220,255,0.04)');
      wingGrd.addColorStop(1, 'rgba(255,200,230,0.02)');
      ctx.fillStyle = wingGrd;
      ctx.fill();

      ctx.strokeStyle = palette.wingMain + '0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Wing veins
      ctx.strokeStyle = palette.wingMain + '0.25)';
      ctx.lineWidth = 0.5;

      // Main vein
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.35, -s * 0.25, s * 0.55, -s * 0.1);
      ctx.stroke();

      // Secondary veins
      for (let v = 0; v < 5; v++) {
        const vt = (v + 1) / 6;
        const vx = lerp(0, s * 0.45, vt);
        const vy = lerp(0, -s * 0.2, vt);
        const angle = -0.8 - v * 0.15;
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(
          vx + Math.cos(angle) * s * 0.2,
          vy + Math.sin(angle) * s * 0.2
        );
        ctx.stroke();
      }

      // Cross veins (cellular pattern)
      ctx.strokeStyle = palette.wingEdge + '0.12)';
      ctx.lineWidth = 0.3;
      for (let i = 0; i < 8; i++) {
        const cx = s * 0.1 + i * s * 0.06;
        const cy = -s * 0.1 - Math.sin(i * 0.8) * s * 0.15;
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.04 + Math.sin(t + i) * 2, 0, TAU);
        ctx.stroke();
      }

      ctx.restore();

      // ── Lower wing ──
      const lwScaleX = 0.7 + wingFlap2 * 0.4;
      ctx.save();
      ctx.scale(lwScaleX, 1);

      ctx.beginPath();
      ctx.moveTo(0, s * 0.02);
      ctx.bezierCurveTo(
        s * 0.25, s * 0.05,
        s * 0.5, s * 0.15,
        s * 0.35, s * 0.35
      );
      ctx.bezierCurveTo(
        s * 0.2, s * 0.3,
        s * 0.05, s * 0.15,
        0, s * 0.1
      );
      ctx.closePath();

      const lwGrd = ctx.createLinearGradient(0, 0, s * 0.4, s * 0.3);
      lwGrd.addColorStop(0, 'rgba(255,200,230,0.05)');
      lwGrd.addColorStop(1, 'rgba(200,170,255,0.02)');
      ctx.fillStyle = lwGrd;
      ctx.fill();

      ctx.strokeStyle = palette.wingEdge + '0.5)';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      // Lower wing veins
      ctx.strokeStyle = palette.wingEdge + '0.2)';
      ctx.lineWidth = 0.4;
      for (let v = 0; v < 3; v++) {
        const vt = (v + 1) / 4;
        ctx.beginPath();
        ctx.moveTo(0, s * 0.06);
        ctx.quadraticCurveTo(
          s * 0.2 * vt, s * 0.1 + v * s * 0.05,
          s * 0.3 * vt + s * 0.1, s * 0.25 * vt + s * 0.1
        );
        ctx.stroke();
      }

      ctx.restore();

      // Wing edge sparkles
      for (let sp = 0; sp < 6; sp++) {
        const spt = sp / 6;
        const spx = s * 0.3 * Math.cos(spt * 2 - 1) * uwScaleX;
        const spy = -s * 0.35 * spt + s * 0.05;
        const sparkleAlpha = (Math.sin(t * 3 + sp * 1.5) * 0.5 + 0.5) * 0.6;
        ctx.beginPath();
        ctx.arc(spx, spy, 1.5, 0, TAU);
        ctx.fillStyle = palette.particle + sparkleAlpha + ')';
        ctx.fill();
      }

      ctx.restore();
    }

    ctx.restore();
  }

  drawSparkles(ctx, t) {
    ctx.save();
    ctx.translate(this.x, this.y);

    for (const sp of this.sparkles) {
      sp.angle += sp.speed * 0.016;
      const dist = sp.dist * this.size * (0.3 + Math.sin(t * sp.speed + sp.phase) * 0.15);
      const px = Math.cos(sp.angle) * dist;
      const py = Math.sin(sp.angle) * dist * 0.8;
      const alpha = sp.brightness * (Math.sin(t * 2 + sp.phase) * 0.5 + 0.5);

      // Sparkle cross
      const sz = sp.size * (0.5 + alpha * 0.5);
      ctx.strokeStyle = palette.particle + alpha + ')';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(px - sz, py);
      ctx.lineTo(px + sz, py);
      ctx.moveTo(px, py - sz);
      ctx.lineTo(px, py + sz);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(px, py, 0.8, 0, TAU);
      ctx.fillStyle = palette.particle + (alpha * 0.8) + ')';
      ctx.fill();
    }

    ctx.restore();
  }

  drawTrail(ctx, t) {
    for (let i = 1; i < this.trail.length; i++) {
      const p = this.trail[i];
      const pp = this.trail[i - 1];
      if (p.alpha < 0.02) continue;
      ctx.beginPath();
      ctx.moveTo(pp.x, pp.y);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = palette.fairyGlow + (p.alpha * 0.3) + ')';
      ctx.lineWidth = p.alpha * 3;
      ctx.stroke();

      // Trail sparkle
      if (Math.random() < 0.3) {
        ctx.beginPath();
        ctx.arc(p.x + rand(-5, 5), p.y + rand(-5, 5), p.alpha * 1.5, 0, TAU);
        ctx.fillStyle = palette.particle + (p.alpha * 0.5) + ')';
        ctx.fill();
      }
    }
  }

  draw(ctx, t) {
    this.drawTrail(ctx, t);
    this.drawWings(ctx, t);
    this.drawBody(ctx, t);
    this.drawSparkles(ctx, t);
  }
}

/* ─── Fireflies ─── */
class Firefly {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W);
    this.y = rand(H * 0.2, H * 0.9);
    this.vx = rand(-0.5, 0.5);
    this.vy = rand(-0.3, 0.3);
    this.phase = rand(0, TAU);
    this.speed = rand(0.5, 2);
    this.size = rand(1.5, 4);
    this.brightness = rand(0.3, 1);
  }
  update(t) {
    this.x += this.vx + Math.sin(t * 0.3 + this.phase) * 0.3;
    this.y += this.vy + Math.cos(t * 0.4 + this.phase) * 0.2;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.reset();
  }
  draw(ctx, t) {
    const glow = (Math.sin(t * this.speed + this.phase) * 0.5 + 0.5) * this.brightness;
    if (glow < 0.1) return;

    // Outer glow
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 6);
    grd.addColorStop(0, palette.firefly + (glow * 0.3) + ')');
    grd.addColorStop(1, palette.firefly + '0)');
    ctx.fillStyle = grd;
    ctx.fillRect(this.x - this.size * 6, this.y - this.size * 6, this.size * 12, this.size * 12);

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * glow, 0, TAU);
    ctx.fillStyle = palette.firefly + glow + ')';
    ctx.fill();
  }
}

/* ─── Dandelion Stem (ground plant) ─── */
function drawDandelionPlant(ctx, x, y, size, t) {
  // Stem
  const stemTop = y - size;
  ctx.strokeStyle = palette.seedStem + '0.3)';
  ctx.lineWidth = 1.5;

  const sway = Math.sin(t * 0.5) * 5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + sway * 0.5, y - size * 0.5, x + sway, stemTop);
  ctx.stroke();

  // Seed head (wireframe sphere)
  const headR = size * 0.15;
  const headX = x + sway;
  const headY = stemTop;

  // Circle outlines for sphere wireframe
  ctx.strokeStyle = palette.seedFluff + '0.3)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.arc(headX, headY, headR, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(headX, headY, headR, headR * 0.4, 0, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(headX, headY, headR * 0.4, headR, 0, 0, TAU);
  ctx.stroke();

  // Remaining seeds attached
  const seedCount = 8 + Math.floor(Math.sin(t * 0.1) * 2);
  for (let i = 0; i < seedCount; i++) {
    const angle = (i / seedCount) * TAU + t * 0.05;
    const sx = headX + Math.cos(angle) * headR;
    const sy = headY + Math.sin(angle) * headR * 0.8;
    const filLen = size * 0.08;

    ctx.strokeStyle = palette.seedFluff + '0.25)';
    ctx.lineWidth = 0.3;
    for (let f = -1; f <= 1; f++) {
      const fa = angle + f * 0.3;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(fa) * filLen, sy + Math.sin(fa) * filLen);
      ctx.stroke();
    }
  }

  // Leaves at base
  ctx.strokeStyle = palette.particle + '0.2)';
  ctx.lineWidth = 0.8;
  for (let side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
      x + side * size * 0.2, y - size * 0.1,
      x + side * size * 0.3 + Math.sin(t * 0.7) * 3, y + size * 0.05
    );
    ctx.stroke();

    // Leaf serrations
    const leafLen = size * 0.3;
    for (let s = 0; s < 4; s++) {
      const lt = (s + 1) / 5;
      const lx = x + side * leafLen * lt;
      const ly = y - size * 0.05 * Math.sin(lt * Math.PI);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + side * 3, ly - 4);
      ctx.stroke();
    }
  }
}

/* ─── Scene Setup ─── */
const fairy = new WireframeFairy(W * 0.5, H * 0.38, Math.min(W, H) * 0.28);
const seeds = Array.from({ length: 25 }, () => new DandelionSeed());
const fireflies = Array.from({ length: 20 }, () => new Firefly());

/* ─── Background ─── */
function drawBackground(ctx, t) {
  // Dark gradient sky
  const skyGrd = ctx.createLinearGradient(0, 0, 0, H);
  skyGrd.addColorStop(0, '#030510');
  skyGrd.addColorStop(0.3, '#060818');
  skyGrd.addColorStop(0.6, '#0a0d20');
  skyGrd.addColorStop(0.85, '#0d1225');
  skyGrd.addColorStop(1, '#080c18');
  ctx.fillStyle = skyGrd;
  ctx.fillRect(0, 0, W, H);

  // Subtle stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 80; i++) {
    // Deterministic star positions
    const sx = ((i * 127.1 + 311.7) % W);
    const sy = ((i * 269.5 + 183.3) % (H * 0.6));
    const twinkle = Math.sin(t * (0.5 + (i % 5) * 0.3) + i) * 0.5 + 0.5;
    ctx.globalAlpha = twinkle * 0.5 + 0.1;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.5 + (i % 3) * 0.3, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Moon (subtle)
  const moonX = W * 0.82;
  const moonY = H * 0.12;
  const moonR = 25;
  const moonGrd = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 4);
  moonGrd.addColorStop(0, 'rgba(200,210,240,0.15)');
  moonGrd.addColorStop(0.3, 'rgba(150,170,210,0.05)');
  moonGrd.addColorStop(1, 'rgba(100,120,180,0)');
  ctx.fillStyle = moonGrd;
  ctx.fillRect(moonX - moonR * 4, moonY - moonR * 4, moonR * 8, moonR * 8);

  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, TAU);
  ctx.fillStyle = 'rgba(200,210,230,0.08)';
  ctx.fill();

  // Ground meadow hint
  const groundY = H * 0.88;
  const gndGrd = ctx.createLinearGradient(0, groundY, 0, H);
  gndGrd.addColorStop(0, 'rgba(10,20,15,0)');
  gndGrd.addColorStop(0.3, 'rgba(10,20,15,0.3)');
  gndGrd.addColorStop(1, 'rgba(5,12,8,0.6)');
  ctx.fillStyle = gndGrd;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Grass blades wireframe
  ctx.strokeStyle = 'rgba(40,80,50,0.2)';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 60; i++) {
    const gx = (i / 60) * W + ((i * 73.1) % 20) - 10;
    const gy = groundY + rand(0, 10);
    const gh = rand(10, 35);
    const gsway = Math.sin(t * 0.8 + i * 0.5) * 4;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.quadraticCurveTo(gx + gsway * 0.5, gy - gh * 0.6, gx + gsway, gy - gh);
    ctx.stroke();
  }
}

/* ─── Main Loop ─── */
let startTime = performance.now();

function frame() {
  const t = (performance.now() - startTime) * 0.001;

  ctx.clearRect(0, 0, W, H);

  // Recalculate fairy position on resize
  fairy.baseX = W * 0.5;
  fairy.baseY = H * 0.38;
  fairy.size = Math.min(W, H) * 0.28;

  drawBackground(ctx, t);

  // Dandelion plants on ground
  drawDandelionPlant(ctx, W * 0.15, H * 0.9, H * 0.25, t);
  drawDandelionPlant(ctx, W * 0.75, H * 0.92, H * 0.18, t);
  drawDandelionPlant(ctx, W * 0.55, H * 0.91, H * 0.2, t + 1);

  // Fireflies (behind fairy)
  for (const ff of fireflies) {
    ff.update(t);
    ff.draw(ctx, t);
  }

  // Floating seeds
  for (const seed of seeds) {
    seed.update(t);
    seed.draw(ctx, t);
  }

  // Fairy
  fairy.update(t);
  fairy.draw(ctx, t);

  requestAnimationFrame(frame);
}
frame();
</script>
