<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Leaves Overlay — Realistic Flutter & Tumble Physics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const TAU = Math.PI * 2;

      let width = 1, height = 1, pixelRatio = 1;
      let elapsed = 0, lastTime = performance.now();
      let overlayScale = 1.0;
      let targetCount = 12;

      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) overlayScale = scaleParam;
        const countParam = parseInt(urlParams.get('count'), 10);
        if (!isNaN(countParam) && countParam > 0) targetCount = countParam;
      }
      parseParams();

      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
      function lerp(from, to, t) { return from + (to - from) * t; }

      function resize() {
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      const LEAF_PALETTES = [
        { primary: '#d63031', secondary: '#e17055', vein: '#636e72', stem: '#2d3436' }, // Crimson Red
        { primary: '#e67e22', secondary: '#f39c12', vein: '#d35400', stem: '#7f8c8d' }, // Flame Orange
        { primary: '#f1c40f', secondary: '#f39c12', vein: '#b7950b', stem: '#7d6608' }, // Amber Gold
        { primary: '#e17055', secondary: '#d63031', vein: '#b2bec3', stem: '#2d3436' }, // Burnt Sienna
        { primary: '#c0392b', secondary: '#9b59b6', vein: '#8e44ad', stem: '#4a235a' }  // Deep Autumn Ruby
      ];

      function createLeaf(index) {
        const seed = index + 1;
        const palette = LEAF_PALETTES[index % LEAF_PALETTES.length];
        
        return {
          x: Math.random() * width,
          y: Math.random() * height * -1.2, // Start scattered above viewport
          z: 0.4 + Math.random() * 0.6,
          size: (18 + Math.random() * 14) * overlayScale,
          rotation: Math.random() * TAU,
          rotationSpeed: (Math.random() - 0.5) * 1.5,
          flipPhase: Math.random() * TAU,
          flipSpeed: 1.2 + Math.random() * 2.2,
          swayPhase: Math.random() * TAU,
          swaySpeed: 0.8 + Math.random() * 1.5,
          swayAmplitude: 25 + Math.random() * 35,
          fallSpeed: 30 + Math.random() * 45,
          palette,
          seed
        };
      }

      let leaves = Array.from({ length: targetCount }, (_, i) => createLeaf(i));

      function updateLeaf(leaf, dt) {
        leaf.swayPhase += dt * leaf.swaySpeed;
        leaf.flipPhase += dt * leaf.flipSpeed;
        leaf.rotation += leaf.rotationSpeed * dt;

        // Aerodynamic sway & drift
        const swayX = Math.sin(leaf.swayPhase) * leaf.swayAmplitude;
        const windGust = Math.sin(elapsed * 0.45 + leaf.seed) * 15;

        leaf.x += (swayX * 0.4 + windGust) * dt;
        leaf.y += leaf.fallSpeed * dt * (0.8 + Math.sin(leaf.flipPhase) * 0.2);

        // Recycle leaf back to top when it drifts past bottom screen edge
        if (leaf.y > height + 40 || leaf.x < -60 || leaf.x > width + 60) {
          leaf.y = -50 - Math.random() * 100;
          leaf.x = Math.random() * width;
          leaf.rotation = Math.random() * TAU;
        }
      }

      // Draw high-fidelity 5-lobed Maple Leaf path with serrations and veins
      function drawMapleLeafPath(ctx, size) {
        ctx.beginPath();
        ctx.moveTo(0, size * 0.5); // Stem base
        
        // Left basal lobe
        ctx.bezierCurveTo(-size * 0.3, size * 0.4, -size * 0.6, size * 0.2, -size * 0.7, 0);
        ctx.lineTo(-size * 0.55, -size * 0.15);
        ctx.lineTo(-size * 0.85, -size * 0.25);
        ctx.lineTo(-size * 0.65, -size * 0.4);

        // Left middle lobe
        ctx.bezierCurveTo(-size * 0.7, -size * 0.6, -size * 0.5, -size * 0.8, -size * 0.3, -size * 0.65);
        ctx.lineTo(-size * 0.2, -size * 0.85);

        // Center main tip lobe
        ctx.bezierCurveTo(-size * 0.1, -size * 1.1, 0, -size * 1.25, 0, -size * 1.25);
        ctx.bezierCurveTo(0, -size * 1.25, size * 0.1, -size * 1.1, size * 0.2, -size * 0.85);
        ctx.lineTo(size * 0.3, -size * 0.65);

        // Right middle lobe
        ctx.bezierCurveTo(size * 0.5, -size * 0.8, size * 0.7, -size * 0.6, size * 0.65, -size * 0.4);
        ctx.lineTo(size * 0.85, -size * 0.25);
        ctx.lineTo(size * 0.55, -size * 0.15);

        // Right basal lobe
        ctx.bezierCurveTo(size * 0.7, 0, size * 0.6, size * 0.2, size * 0.3, size * 0.4);
        ctx.closePath();
      }

      function drawLeaf(leaf) {
        const depthScale = 0.65 + leaf.z * 0.7;
        const size = leaf.size * depthScale;
        const flipScale = Math.cos(leaf.flipPhase); // 3D flipping contraction

        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.rotation + Math.sin(leaf.swayPhase) * 0.25);
        ctx.scale(flipScale, 1.0); // 3D flip effect along horizontal axis

        // Leaf shadow
        ctx.save();
        ctx.translate(3, 5);
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#000000';
        drawMapleLeafPath(ctx, size);
        ctx.fill();
        ctx.restore();

        // Fill Leaf Body with rich autumn gradient
        const leafGrad = ctx.createRadialGradient(0, -size * 0.3, 2, 0, 0, size * 1.1);
        leafGrad.addColorStop(0, leaf.palette.secondary);
        leafGrad.addColorStop(0.6, leaf.palette.primary);
        leafGrad.addColorStop(1, '#3e1707');

        ctx.fillStyle = leafGrad;
        drawMapleLeafPath(ctx, size);
        ctx.fill();
        ctx.strokeStyle = 'rgba(60, 20, 5, 0.45)';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        // Central Stem & Branching Veins
        ctx.strokeStyle = leaf.palette.vein;
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(0, size * 0.65);
        ctx.lineTo(0, -size * 1.1);
        ctx.stroke();

        // Branching veins to main lobes
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        // Left main vein
        ctx.moveTo(0, -size * 0.1);
        ctx.lineTo(-size * 0.55, -size * 0.55);
        // Right main vein
        ctx.moveTo(0, -size * 0.1);
        ctx.lineTo(size * 0.55, -size * 0.55);
        // Lower left vein
        ctx.moveTo(0, size * 0.2);
        ctx.lineTo(-size * 0.45, -size * 0.1);
        // Lower right vein
        ctx.moveTo(0, size * 0.2);
        ctx.lineTo(size * 0.45, -size * 0.1);
        ctx.stroke();

        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        ctx.clearRect(0, 0, width, height);

        for (const leaf of leaves) {
          updateLeaf(leaf, dt);
          drawLeaf(leaf);
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
