<!doctype html>
<html lang="en">
<head>

  <style>
    html, body {
      width: 100%;
      height: 100%;

<body>
  <canvas id="world" aria-label="Three image-traced dandelion seeds floating in a pitch-black screen world"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('world');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const BLACK = '#000000';
      const PX_PER_MM = 96 / 25.4;
      const DISPLAY_HEIGHT = 17 * 2 * PX_PER_MM;
      
      const urlParams = new URLSearchParams(window.location.search);
      const globalScale = parseFloat(urlParams.get('scale')) || 1.0;
      
      const UNIT = (DISPLAY_HEIGHT / 136) * 0.8 * globalScale;
      const TAU = Math.PI * 2;
      const REFERENCE_FILAMENTS = [{"c1":[-10.48,-3.83],"c2":[-35.67,-7.79],"e":[-50.7,-12.09],"a":0.5,"w":0.29,"p":0.0,"k":0.7},{"c1":[-10.36,-4.34],"c2":[-36.97,-6.58],"e":[-50.7,-14.43],"a":0.87,"w":0.31,"p":2.4,"k":0.99},{"c1":[-9.0,-4.69],"c2":[-30.85,-11.19],"e":[-44.07,-15.99],"a":0.83,"w":0.33,"p":4.8,"k":0.94},{"c1":[-11.12,-6.06],"c2":[-42.46,-7.81],"e":[-50.7,-22.23],"a":0.79,"w":0.35,"p":0.917,"k":0.89},{"c1":[-10.52,-6.4],"c2":[-38.82,-11.91],"e":[-50.7,-23.79],"a":0.75,"w":0.37,"p":3.317,"k":0.84},{"c1":[-8.26,-6.4],"c2":[-26.14,-17.75],"e":[-38.22,-23.79],"a":0.71,"w":0.39,"p":5.717,"k":0.79},{"c1":[-8.24,-7.26],"c2":[-34.09,-14.64],"e":[-41.34,-27.69],"a":0.67,"w":0.41,"p":1.834,"k":0.74},{"c1":[-9.61,-7.69],"c2":[-47.01,-14.98],"e":[-42.12,-29.64],"a":0.63,"w":0.43,"p":4.234,"k":1.03},{"c1":[-9.24,-8.72],"c2":[-41.53,-17.71],"e":[-44.85,-34.32],"a":0.59,"w":0.45,"p":0.351,"k":0.98},{"c1":[-8.49,-8.12],"c2":[-27.56,-22.13],"e":[-39.39,-31.59],"a":0.55,"w":0.3,"p":2.751,"k":0.93},{"c1":[-8.55,-8.29],"c2":[-29.89,-19.87],"e":[-38.22,-32.37],"a":0.51,"w":0.32,"p":5.151,"k":0.88},{"c1":[-9.26,-8.72],"c2":[-29.38,-21.7],"e":[-38.22,-34.32],"a":0.88,"w":0.34,"p":1.268,"k":0.83},{"c1":[-7.33,-8.98],"c2":[-27.26,-23.41],"e":[-36.66,-35.49],"a":0.84,"w":0.36,"p":3.668,"k":0.78},{"c1":[-6.45,-9.49],"c2":[-29.13,-23.25],"e":[-32.37,-37.83],"a":0.8,"w":0.38,"p":6.068,"k":0.73},{"c1":[-4.64,-7.43],"c2":[-23.4,-17.41],"e":[-23.4,-28.47],"a":0.76,"w":0.4,"p":2.184,"k":1.02},{"c1":[-5.82,-7.52],"c2":[-11.62,-28.86],"e":[-22.62,-28.86],"a":0.72,"w":0.42,"p":4.584,"k":0.97},{"c1":[-5.98,-10.26],"c2":[-23.61,-27.23],"e":[-29.25,-41.34],"a":0.68,"w":0.44,"p":0.701,"k":0.92},{"c1":[-4.73,-10.01],"c2":[-22.56,-26.2],"e":[-25.35,-40.17],"a":0.64,"w":0.29,"p":3.101,"k":0.87},{"c1":[-6.13,-11.21],"c2":[-26.91,-29.74],"e":[-26.91,-45.63],"a":0.6,"w":0.31,"p":5.501,"k":0.82},{"c1":[-4.0,-8.46],"c2":[-15.06,-22.27],"e":[-18.33,-33.15],"a":0.56,"w":0.33,"p":1.618,"k":0.77},{"c1":[-4.27,-10.18],"c2":[-13.02,-28.06],"e":[-15.6,-40.95],"a":0.52,"w":0.35,"p":4.018,"k":0.72},{"c1":[-2.03,-8.12],"c2":[-16.93,-23.92],"e":[-10.53,-31.59],"a":0.89,"w":0.37,"p":0.135,"k":1.01},{"c1":[-3.0,-8.03],"c2":[-3.62,-23.54],"e":[-9.75,-31.2],"a":0.85,"w":0.39,"p":2.535,"k":0.96},{"c1":[-2.99,-10.18],"c2":[-8.49,-28.38],"e":[-9.75,-40.95],"a":0.81,"w":0.41,"p":4.935,"k":0.91},{"c1":[-0.16,-8.63],"c2":[-2.96,-23.78],"e":[-1.95,-33.93],"a":0.77,"w":0.43,"p":1.052,"k":0.86},{"c1":[1.7,-8.03],"c2":[2.05,-21.95],"e":[3.9,-31.2],"a":0.73,"w":0.45,"p":3.452,"k":0.81},{"c1":[2.34,-10.09],"c2":[6.15,-28.57],"e":[9.75,-40.56],"a":0.69,"w":0.3,"p":5.852,"k":0.76},{"c1":[2.08,-9.66],"c2":[6.7,-27.14],"e":[10.14,-38.61],"a":0.65,"w":0.32,"p":1.969,"k":0.71},{"c1":[4.0,-9.58],"c2":[14.27,-27.4],"e":[21.84,-38.22],"a":0.61,"w":0.34,"p":4.369,"k":1.0},{"c1":[4.96,-9.24],"c2":[18.11,-25.25],"e":[24.96,-36.66],"a":0.57,"w":0.36,"p":0.486,"k":0.95},{"c1":[5.77,-7.61],"c2":[16.13,-21.2],"e":[24.18,-29.25],"a":0.53,"w":0.38,"p":2.886,"k":0.9},{"c1":[6.34,-7.26],"c2":[17.48,-19.38],"e":[24.96,-27.69],"a":0.9,"w":0.4,"p":5.286,"k":0.85},{"c1":[4.46,-4.6],"c2":[12.49,-10.04],"e":[16.38,-15.6],"a":0.86,"w":0.42,"p":1.403,"k":0.8},{"c1":[5.48,-5.29],"c2":[14.78,-13.07],"e":[21.06,-18.72],"a":0.82,"w":0.44,"p":3.803,"k":0.75},{"c1":[5.66,-5.03],"c2":[15.9,-11.61],"e":[21.84,-17.55],"a":0.78,"w":0.29,"p":6.203,"k":0.7},{"c1":[6.48,-6.32],"c2":[21.79,-17.28],"e":[31.98,-23.4],"a":0.74,"w":0.31,"p":2.32,"k":0.99},{"c1":[8.6,-6.49],"c2":[25.67,-17.35],"e":[37.05,-24.18],"a":0.7,"w":0.33,"p":4.72,"k":0.94},{"c1":[10.12,-6.15],"c2":[29.29,-16.21],"e":[42.12,-22.62],"a":0.66,"w":0.35,"p":0.837,"k":0.89},{"c1":[9.08,-4.52],"c2":[27.52,-10.11],"e":[39.0,-15.21],"a":0.62,"w":0.37,"p":3.237,"k":0.84},{"c1":[8.49,-3.92],"c2":[24.44,-8.37],"e":[34.71,-12.48],"a":0.58,"w":0.39,"p":5.637,"k":0.79},{"c1":[9.42,-4.26],"c2":[30.5,-8.03],"e":[42.51,-14.04],"a":0.54,"w":0.41,"p":1.754,"k":0.74},{"c1":[8.11,-3.57],"c2":[27.68,-10.92],"e":[40.17,-10.92],"a":0.5,"w":0.43,"p":4.153,"k":1.03},{"c1":[8.88,-2.8],"c2":[31.23,-3.56],"e":[44.07,-7.41],"a":0.87,"w":0.45,"p":0.27,"k":0.98},{"c1":[8.69,-2.03],"c2":[28.18,-2.19],"e":[40.17,-3.9],"a":0.83,"w":0.3,"p":2.67,"k":0.93},{"c1":[7.86,-1.08],"c2":[23.12,2.32],"e":[32.76,0.39],"a":0.79,"w":0.32,"p":5.07,"k":0.88},{"c1":[7.42,-0.83],"c2":[22.42,0.6],"e":[31.98,1.56],"a":0.75,"w":0.34,"p":1.187,"k":0.83},{"c1":[8.32,-0.23],"c2":[26.68,4.29],"e":[38.22,4.29],"a":0.71,"w":0.36,"p":3.587,"k":0.78},{"c1":[5.51,0.8],"c2":[18.4,8.97],"e":[26.91,8.97],"a":0.67,"w":0.38,"p":5.987,"k":0.73}];

      let width = 1;
      let height = 1;
      let dpr = 1;
      let elapsed = 0;
      let lastTime = performance.now();
      let paused = false;
      let globalGust = 0;
      let fitScale = 1;
      let seeds = [];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, amount) {
        return a + (b - a) * amount;
      }

      function makeSeed(x, y, vx, vy, phase, size, angle) {
        const variation = Math.random(); // Used to make each seed unique
        return {
          x, y, vx, vy, phase, size, angle, variation,
          angularVelocity: 0,
          filaments: REFERENCE_FILAMENTS.map((source, index) => {
            // Apply slight random noise to each fiber's endpoints based on the seed's variation
            const scale = 0.85 + (variation * 0.3) + (Math.sin(index * 1.7 + phase) * 0.15);
            return {
              ...source,
              e: [source.e[0] * scale, source.e[1] * scale],
              c1: [source.c1[0] * scale, source.c1[1] * scale],
              c2: [source.c2[0] * scale, source.c2[1] * scale],
              depth: Math.sin(source.p + phase * 0.19),
              deflection: 0,
              deflectionVelocity: 0,
              index
            };
          })
        };
      }

      function seedScale(seed) {
        return UNIT * fitScale * seed.size;
      }

      function createSeeds() {
        seeds = [
          makeSeed(width * 0.23, height * 0.31, 8.5, 3.5, 0.2, 0.94, -0.11),
          makeSeed(width * 0.56, height * 0.57, -6.0, 4.0, 2.6, 1.03, 0.16),
          makeSeed(width * 0.79, height * 0.27, 4.0, 5.5, 4.8, 0.89, -0.04)
        ];
        for (const seed of seeds) constrainSeed(seed);
      }

      function resize() {
        const oldWidth = width || innerWidth;
        const oldHeight = height || innerHeight;
        const positions = seeds.map(seed => [seed.x / oldWidth, seed.y / oldHeight]);

        width = Math.max(1, innerWidth);
        height = Math.max(1, innerHeight);
        dpr = Math.min(devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fitScale = Math.min(1, width / 620, height / 480);

        if (!seeds.length) {
          createSeeds();
        } else {
          seeds.forEach((seed, index) => {
            seed.x = positions[index][0] * width;
            seed.y = positions[index][1] * height;
            constrainSeed(seed);
          });
        }
      }

      function reset() {
        elapsed = 0;
        globalGust = 0;
        createSeeds();
      }

      function extents(seed) {
        const s = seedScale(seed);
        return { x: 56 * s, top: 52 * s, bottom: 102 * s };
      }

      function constrainSeed(seed) {
        const e = extents(seed);
        seed.x = clamp(seed.x, e.x, width - e.x);
        seed.y = clamp(seed.y, e.top, height - e.bottom);
      }

      function airAt(seed) {
        const nx = seed.x / Math.max(width, 1);
        const ny = seed.y / Math.max(height, 1);
        const t = elapsed + seed.phase;
        return {
          x:
            7.6 * Math.sin(t * 0.31 + ny * 5.4) +
            4.1 * Math.sin(t * 0.79 - nx * 6.0 + seed.phase) +
            1.7 * Math.sin(t * 1.53 + nx * 3.1),
          y:
            4.2 * Math.sin(t * 0.27 + nx * 5.0 + 0.5) +
            2.3 * Math.sin(t * 0.89 + ny * 6.7 + seed.phase) +
            1.1 * Math.sin(t * 1.47 - nx * 2.6)
        };
      }

      function updateSeed(seed, dt) {
        const air = airAt(seed);
        const gust = globalGust * (0.80 + 0.20 * Math.sin(elapsed * 3.8 + seed.phase));
        const personalDrift = Math.sin(seed.phase * 1.9) * 3.2;
        const desiredVx = personalDrift + air.x + gust;
        const desiredVy = 5.8 + air.y;
        const response = 1 - Math.exp(-0.82 * dt);

        seed.vx += (desiredVx - seed.vx) * response;
        seed.vy += (desiredVy - seed.vy) * response;

        const thermal = Math.max(0, Math.sin(elapsed * 0.21 + seed.phase + seed.x / Math.max(width, 1) * 5.1));
        seed.vy -= thermal * 4.3 * dt;

        const e = extents(seed);
        const edgeBand = Math.max(84, Math.min(width, height) * 0.13);
        const left = seed.x - e.x;
        const right = width - e.x - seed.x;
        const top = seed.y - e.top;
        const bottom = height - e.bottom - seed.y;

        if (left < edgeBand) seed.vx += 34 * (1 - left / edgeBand) * dt;
        if (right < edgeBand) seed.vx -= 38 * (1 - right / edgeBand) * dt;
        if (top < edgeBand) seed.vy += 31 * (1 - top / edgeBand) * dt;
        if (bottom < edgeBand) seed.vy -= 38 * (1 - bottom / edgeBand) * dt;

        seed.x += seed.vx * dt;
        seed.y += seed.vy * dt;

        const targetAngle = clamp(seed.vx * 0.0102, -0.30, 0.72);
        const torque = (targetAngle - seed.angle) * 1.12 - seed.angularVelocity * 1.60;
        seed.angularVelocity += torque * dt;
        seed.angle += seed.angularVelocity * dt;

        const localWind = clamp((air.x + gust) / 34, -1.25, 1.25);
        for (const filament of seed.filaments) {
          const microEddy =
            Math.sin(elapsed * (1.30 + filament.k * 0.43) + filament.p + seed.phase) *
            0.010;
          const target = localWind * 0.070 * filament.k + microEddy;
          const stiffness = 10.5 + filament.k * 5.8;
          const damping = 2 * Math.sqrt(stiffness) * 0.82;
          filament.deflectionVelocity +=
            ((target - filament.deflection) * stiffness -
              filament.deflectionVelocity * damping) *
            dt;
          filament.deflection += filament.deflectionVelocity * dt;
        }

        constrainSeed(seed);
      }

      function separateSeeds(dt) {
        for (let i = 0; i < seeds.length; i++) {
          for (let j = i + 1; j < seeds.length; j++) {
            const a = seeds[i];
            const b = seeds[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const comfort = 104 * UNIT * fitScale;
            if (distance < comfort) {
              const push = (1 - distance / comfort) * 5.5 * dt;
              const nx = dx / distance;
              const ny = dy / distance;
              a.vx -= nx * push;
              a.vy -= ny * push;
              b.vx += nx * push;
              b.vy += ny * push;
            }
          }
        }
      }

      function update(dt) {
        elapsed += dt;
        globalGust *= Math.exp(-1.65 * dt);
        
        // Trigger a strong breeze occasionally (roughly 5-10 times an hour, or manually tested scale)
        if (Math.random() < dt * 0.003) {
          globalGust += (Math.random() > 0.5 ? 1 : -1) * (150 + Math.random() * 200);
        }

        for (const seed of seeds) updateSeed(seed, dt);
        separateSeeds(dt);
      }

      function deformPoint(point, fraction, filament) {
        const angle = filament.deflection * Math.pow(fraction, 1.72);
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        const x = point[0] * cosine - point[1] * sine;
        const y = point[0] * sine + point[1] * cosine;
        const ripple =
          Math.sin(elapsed * 2.0 + filament.p + fraction * 1.8) *
          0.34 *
          fraction *
          filament.k;
        return [x, y + ripple];
      }

      function drawFilament(filament, index) {
        const c1 = deformPoint(filament.c1, 0.30, filament);
        const c2 = deformPoint(filament.c2, 0.66, filament);
        const tip = deformPoint(filament.e, 1, filament);
        const frontFactor = 0.76 + (filament.depth + 1) * 0.12;
        const alpha = filament.a * frontFactor;

        ctx.strokeStyle = 'rgba(255,255,246,' + alpha.toFixed(3) + ')';
        ctx.lineWidth = filament.w;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
        ctx.stroke();

        if (Math.sin(filament.p * 2.7 + index) > 0.18) {
          const baseX = lerp(c2[0], tip[0], 0.50);
          const baseY = lerp(c2[1], tip[1], 0.50);
          const length = Math.max(1, Math.hypot(tip[0], tip[1]));
          const normalX = -tip[1] / length;
          const normalY = tip[0] / length;
          ctx.strokeStyle = 'rgba(255,255,248,' + (alpha * 0.62).toFixed(3) + ')';
          ctx.lineWidth = 0.27;
          ctx.beginPath();
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(baseX + normalX * 1.55, baseY + normalY * 1.55);
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(baseX - normalX * 1.2, baseY - normalY * 1.2);
          ctx.stroke();
        }
      }

      function drawAchene() {
        const bodyGradient = ctx.createLinearGradient(-2.2, 71, 2.4, 94);
        bodyGradient.addColorStop(0, '#6b4428');
        bodyGradient.addColorStop(0.28, '#a66f3e');
        bodyGradient.addColorStop(0.55, '#bc8750');
        bodyGradient.addColorStop(0.80, '#84552f');
        bodyGradient.addColorStop(1, '#4e311f');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.moveTo(0.05, 71.0);
        ctx.bezierCurveTo(1.85, 72.7, 2.35, 77.6, 2.05, 83.3);
        ctx.bezierCurveTo(1.8, 88.2, 0.95, 93.4, 0.15, 96.1);
        ctx.bezierCurveTo(-0.45, 97.5, -1.05, 97.4, -1.55, 95.9);
        ctx.bezierCurveTo(-2.55, 91.8, -2.65, 84.0, -2.25, 78.2);
        ctx.bezierCurveTo(-1.95, 74.1, -1.0, 71.7, 0.05, 71.0);
        ctx.fill();

        ctx.strokeStyle = 'rgba(72,43,25,0.64)';
        ctx.lineWidth = 0.30;
        for (let rib = -1; rib <= 1; rib++) {
          const x = rib * 0.82;
          ctx.beginPath();
          ctx.moveTo(x * 0.30, 73.0);
          ctx.bezierCurveTo(x * 0.82, 79.2, x, 88.1, x * 0.34, 94.8);
          ctx.stroke();
        }

        ctx.fillStyle = '#50311e';
        ctx.beginPath();
        ctx.moveTo(-0.55, 95.4);
        ctx.lineTo(0, 98.2);
        ctx.lineTo(0.52, 95.4);
        ctx.closePath();
        ctx.fill();
      }

      function drawSeed(seed) {
        ctx.save();
        ctx.translate(seed.x, seed.y);
        ctx.rotate(seed.angle);
        const scale = seedScale(seed);
        ctx.scale(scale, scale);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = 0; i < seed.filaments.length; i++) {
          if (seed.filaments[i].depth <= 0) drawFilament(seed.filaments[i], i);
        }

        const beakGradient = ctx.createLinearGradient(0, 0, 0, 72);
        beakGradient.addColorStop(0, 'rgba(229,214,170,0.98)');
        beakGradient.addColorStop(0.38, 'rgba(188,155,103,0.96)');
        beakGradient.addColorStop(1, 'rgba(123,82,48,0.98)');
        ctx.strokeStyle = beakGradient;
        ctx.lineWidth = 0.48;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-0.34, 19, 0.42, 46, 0, 71.4);
        ctx.stroke();

        const hubGradient = ctx.createRadialGradient(-0.35, -0.6, 0.15, 0, 0, 2);
        hubGradient.addColorStop(0, '#fffceb');
        hubGradient.addColorStop(0.62, '#e9dfb7');
        hubGradient.addColorStop(1, '#a88455');
        ctx.fillStyle = hubGradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.7, 1.15, 0, 0, TAU);
        ctx.fill();

        for (let i = 0; i < seed.filaments.length; i++) {
          if (seed.filaments[i].depth > 0) drawFilament(seed.filaments[i], i);
        }

        drawAchene();
        ctx.restore();
      }

      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        const ordered = [...seeds].sort((a, b) => a.size - b.size);
        for (const seed of ordered) drawSeed(seed);
      }

      function frame(now) {
        const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        if (!paused) update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (event.code === 'Space') {
          paused = !paused;
          event.preventDefault();
        } else if (key === 'g') {
          globalGust = Math.max(globalGust, 24);
        } else if (key === 'r') {
          reset();
        } else if (key === 'f') {
          document.documentElement.requestFullscreen?.();
        }
      });

      addEventListener('pointerdown', event => {
        for (const seed of seeds) {
          const dx = seed.x - event.clientX;
          const dy = seed.y - event.clientY;
          const distance = Math.max(80, Math.hypot(dx, dy));
          seed.vx += (dx / distance) * 17;
          seed.vy += (dy / distance) * 11;
        }
        globalGust = Math.max(globalGust, 15);
      }, { passive: true });

      resize();
      reset();
      requestAnimationFrame(frame);
    })();
  </script>
