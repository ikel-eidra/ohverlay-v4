<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Data Widgets — Weather, Stock Market & News Ticker Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none; -webkit-user-select: none;
    }

    /* Top Horizontal Live Ticker Bar */
    .ticker-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(10, 15, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 6px 20px;
      color: #f3f4f6;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 500;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-up { color: #10b981; font-weight: 600; }
    .stat-down { color: #ef4444; font-weight: 600; }
    .divider { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.15); }

    /* Live Weather Card (Top-Left Docked) */
    .weather-card {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(13, 19, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 16px;
      color: #ffffff;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .weather-icon { font-size: 24px; }
    .weather-temp { font-size: 16px; font-weight: 700; }
    .weather-city { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Live Weather Card -->
  <div class="weather-card">
    <div class="weather-icon" id="weatherIcon">☀️</div>
    <div>
      <div class="weather-temp" id="weatherTemp">29°C</div>
      <div class="weather-city" id="weatherCity">Manila • Clear Sky</div>
    </div>
  </div>

  <!-- Live Market & News Ticker -->
  <div class="ticker-bar">
    <div class="ticker-item">
      <span>📈 BTC/USD</span>
      <span class="stat-up">$64,250 (+2.4%)</span>
    </div>
    <div class="divider"></div>
    <div class="ticker-item">
      <span>📊 NVDA</span>
      <span class="stat-up">$128.50 (+1.8%)</span>
    </div>
    <div class="divider"></div>
    <div class="ticker-item">
      <span>📰 TECH NEWS</span>
      <span style="color: #cbd5e1;" id="newsHeadline">AI Assistants Redefining Personal Workstations</span>
    </div>
  </div>

  <script>
    // Live Weather Fetch via Open-Meteo (Free, No API Key Required)
    async function fetchLiveWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=14.5995&longitude=120.9842&current_weather=true');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          document.getElementById('weatherTemp').textContent = `${temp}°C`;
        }
      } catch(e) {}
    }
    fetchLiveWeather();
    setInterval(fetchLiveWeather, 600000); // 10 mins
  </script>
</body>
</html>
