<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Manta Ray Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

// Color palette for manta ray
const palette = {
  mantaBody:    'rgba(100,180,255,',    // deep blue
  mantaWire:    'rgba(150,220,255,',    // bright cyan
  mantaGlow:    'rgba(100,200,255,',    // soft glow
  mantaEdge:    'rgba(180,240,255,',    // edge highlight
  mantaAccent:  'rgba(200,255,240,',    // cyan accent
  auraLight:    'rgba(120,200,255,',    // aura light
  particleGlow: 'rgba(150,220,255,',    // particle sparkle
};

/* ─── Wireframe Manta Ray ─── */
class WireframeMantaRay {
  constructor(x, y, size) {
    this.baseX = x;
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.size = size;
    this.glidePhase = rand(0, TAU);
    this.wingPhase = 0;
    this.tailPhase = 0;
    this.breathPhase = 0;
    this.particles = [];

    // Create particle aura
    for (let i = 0; i < 60; i++) {
      this.particles.push({
        angle: rand(0, TAU),
        dist: rand(0.3, 2.0),
        speed: rand(0.2, 0.8),
        size: rand(0.3, 1.5),
        phase: rand(0, TAU),
        brightness: rand(0.2, 0.8),
      });
    }
  }

  update(t) {
    this.glidePhase += 0.012;
    this.wingPhase = t * 1.5;
    this.tailPhase = t * 2.0;
    this.breathPhase = t * 0.8;

    // Smooth gliding motion through center
    this.x = this.baseX + Math.sin(this.glidePhase * 0.5) * 100 + Math.sin(this.glidePhase * 0.3) * 50;
    this.y = this.baseY + Math.sin(this.glidePhase * 0.7) * 80 + Math.cos(this.glidePhase * 0.4) * 40;
  }

  drawBody(ctx, t) {
    const s = this.size;
    const breathOffset = Math.sin(this.breathPhase) * s * 0.03;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Main body outline (diamond/kite shape)
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.5);                    // front
    ctx.lineTo(s * 0.6, s * 0.2);              // right wing tip
    ctx.lineTo(s * 0.3, s * 0.5);              // right rear
    ctx.lineTo(0, s * 0.6);                    // tail base
    ctx.lineTo(-s * 0.3, s * 0.5);             // left rear
    ctx.lineTo(-s * 0.6, s * 0.2);             // left wing tip
    ctx.closePath();

    // Body glow gradient
    const bodyGlow = ctx.createRadialGradient(0, -s * 0.1, 0, 0, 0, s * 1.2);
    bodyGlow.addColorStop(0, palette.mantaGlow + '0.08)');
    bodyGlow.addColorStop(0.5, palette.mantaGlow + '0.03)');
    bodyGlow.addColorStop(1, palette.mantaGlow + '0)');
    ctx.fillStyle = bodyGlow;
    ctx.fill();

    // Body wireframe edges
    ctx.strokeStyle = palette.mantaWire + '0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ─── Internal wireframe structure ───
    ctx.strokeStyle = palette.mantaWire + '0.35)';
    ctx.lineWidth = 0.8;

    // Horizontal rings
    for (let ring = 0.2; ring <= 0.8; ring += 0.2) {
      const ringY = lerp(-s * 0.5, s * 0.6, ring);
      const ringW = Math.sin(ring * Math.PI) * s * 0.5;
      ctx.beginPath();
      ctx.ellipse(0, ringY, ringW, ringW * 0.15, 0, 0, TAU);
      ctx.stroke();
    }

    // Lateral ridge lines (aerodynamic flow)
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(side * s * 0.6, s * 0.2);
      ctx.quadraticCurveTo(
        side * s * 0.4, s * 0.35,
        side * s * 0.15, s * 0.55
      );
      ctx.stroke();
    }

    // Central spine
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.5);
    ctx.lineTo(0, s * 0.6);
    ctx.stroke();

    // ─── Wing Details ───
    ctx.strokeStyle = palette.mantaEdge + '0.5)';
    ctx.lineWidth = 0.6;

    for (let side = -1; side <= 1; side += 2) {
      // Wing veins
      for (let v = 0; v < 5; v++) {
        const vt = (v + 1) / 6;
        const vx = lerp(0, side * s * 0.6, vt);
        const vy = lerp(-s * 0.3, s * 0.2, vt);
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(
          vx + side * Math.sin(t * 1.2 + v) * 2,
          vy + Math.cos(t * 1.5 + v) * 1.5
        );
        ctx.stroke();
      }

      // Wing edge glow points
      const wingTipX = side * s * 0.65;
      const wingTipY = s * 0.15;
      ctx.beginPath();
      ctx.arc(wingTipX, wingTipY, 2, 0, TAU);
      ctx.fillStyle = palette.mantaAccent + '0.6)';
      ctx.fill();
    }

    // ─── Tail ───
    ctx.strokeStyle = palette.mantaWire + '0.5)';
    ctx.lineWidth = 1;

    const tailCurve = Math.sin(this.tailPhase * 0.4) * s * 0.15;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.6);
    ctx.quadraticCurveTo(
      tailCurve, s * 0.75,
      tailCurve * 1.5, s * 0.95
    );
    ctx.stroke();

    // Tail fin
    ctx.beginPath();
    ctx.moveTo(tailCurve * 1.5, s * 0.95);
    ctx.lineTo(tailCurve * 1.5 - s * 0.08, s * 1.0);
    ctx.lineTo(tailCurve * 1.5 + s * 0.08, s * 1.0);
    ctx.closePath();
    ctx.fillStyle = palette.mantaAccent + '0.4)';
    ctx.fill();
    ctx.stroke();

    // ─── Gill slits ───
    ctx.strokeStyle = palette.mantaWire + '0.3)';
    ctx.lineWidth = 0.5;
    for (let i = 1; i <= 3; i++) {
      const gillY = lerp(-s * 0.3, s * 0.3, i / 4);
      ctx.beginPath();
      ctx.arc(0, gillY, s * 0.15 - i * s * 0.02, 0, Math.PI);
      ctx.stroke();
    }

    // ─── Eyes ───
    for (let side = -1; side <= 1; side += 2) {
      const eyeX = side * s * 0.25;
      const eyeY = -s * 0.35;

      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 2.5, 0, TAU);
      ctx.fillStyle = palette.mantaAccent + '0.8)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 3.5, 0, TAU);
      ctx.strokeStyle = palette.mantaEdge + '0.5)';
      ctx.lineWidth = 0.7;
      ctx.stroke();

      // Eye glow
      const eyeGlow = ctx.createRadialGradient(eyeX, eyeY, 0, eyeX, eyeY, 8);
      eyeGlow.addColorStop(0, palette.mantaAccent + '0.1)');
      eyeGlow.addColorStop(1, palette.mantaAccent + '0)');
      ctx.fillStyle = eyeGlow;
      ctx.fillRect(eyeX - 8, eyeY - 8, 16, 16);
    }

    // ─── Front horn/cephalic fins ───
    ctx.strokeStyle = palette.mantaEdge + '0.6)';
    ctx.lineWidth = 0.8;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(side * s * 0.15, -s * 0.45);
      ctx.quadraticCurveTo(
        side * s * 0.25, -s * 0.55,
        side * s * 0.2, -s * 0.65
      );
      ctx.stroke();
    }

    ctx.restore();
  }

  drawAura(ctx, t) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Multiple glow rings
    for (let ring = 0; ring < 3; ring++) {
      const ringRad = this.size * (0.7 + ring * 0.35);
      const ringAlpha = 0.15 * (1 - ring / 3) * (Math.sin(t * 0.5 + ring) * 0.5 + 0.5);

      const ringGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, ringRad);
      ringGlow.addColorStop(0, palette.auraLight + ringAlpha + ')');
      ringGlow.addColorStop(0.7, palette.auraLight + (ringAlpha * 0.3) + ')');
      ringGlow.addColorStop(1, palette.auraLight + '0)');

      ctx.fillStyle = ringGlow;
      ctx.beginPath();
      ctx.arc(0, 0, ringRad, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }

  drawParticles(ctx, t) {
    ctx.save();
    ctx.translate(this.x, this.y);

    for (const p of this.particles) {
      p.angle += p.speed * 0.016;
      const dist = p.dist * this.size * (0.4 + Math.sin(t * p.speed + p.phase) * 0.2);
      const px = Math.cos(p.angle) * dist;
      const py = Math.sin(p.angle) * dist * 0.7;
      const alpha = p.brightness * (Math.sin(t * 1.5 + p.phase) * 0.5 + 0.5);

      // Particle glow
      const pGlow = ctx.createRadialGradient(px, py, 0, px, py, 4);
      pGlow.addColorStop(0, palette.particleGlow + (alpha * 0.6) + ')');
      pGlow.addColorStop(1, palette.particleGlow + '0)');
      ctx.fillStyle = pGlow;
      ctx.fillRect(px - 4, py - 4, 8, 8);

      // Particle dot
      ctx.beginPath();
      ctx.arc(px, py, p.size * (0.5 + alpha * 0.5), 0, TAU);
      ctx.fillStyle = palette.particleGlow + alpha + ')';
      ctx.fill();
    }

    ctx.restore();
  }

  draw(ctx, t) {
    this.drawAura(ctx, t);
    this.drawParticles(ctx, t);
    this.drawBody(ctx, t);
  }
}

/* ─── Background ─── */
function drawBackground(ctx, t) {
  const skyGrd = ctx.createLinearGradient(0, 0, 0, H);
  skyGrd.addColorStop(0, '#050515');
  skyGrd.addColorStop(0.3, '#0a0820');
  skyGrd.addColorStop(0.6, '#0d0f28');
  skyGrd.addColorStop(1, '#0a0618');
  ctx.fillStyle = skyGrd;
  ctx.fillRect(0, 0, W, H);

  // Subtle bioluminescent stars
  ctx.fillStyle = 'rgba(100,200,255,0.3)';
  for (let i = 0; i < 120; i++) {
    const sx = ((i * 131.1 + 327.7) % W);
    const sy = ((i * 271.5 + 189.3) % (H * 0.7));
    const twinkle = Math.sin(t * (0.3 + (i % 7) * 0.15) + i) * 0.5 + 0.5;
    ctx.globalAlpha = twinkle * 0.4 + 0.1;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.4 + (i % 4) * 0.2, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Water light gradient
  const waterGrd = ctx.createLinearGradient(0, H * 0.7, 0, H);
  waterGrd.addColorStop(0, 'rgba(10,30,50,0)');
  waterGrd.addColorStop(0.5, 'rgba(20,50,80,0.15)');
  waterGrd.addColorStop(1, 'rgba(10,25,45,0.4)');
  ctx.fillStyle = waterGrd;
  ctx.fillRect(0, H * 0.7, W, H * 0.3);

  // Subtle light rays
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = 'rgba(150,220,255,0.3)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 8; i++) {
    const lx = (i / 8) * W + Math.sin(t * 0.2 + i) * 20;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx + Math.sin(t * 0.3 + i * 0.5) * 30, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ─── Scene Setup ─── */
const mantaRay = new WireframeMantaRay(W * 0.5, H * 0.4, Math.min(W, H) * 0.25);

/* ─── Main Loop ─── */
let startTime = performance.now();

function frame() {
  const t = (performance.now() - startTime) * 0.001;

  ctx.clearRect(0, 0, W, H);

  // Recalculate manta position on resize
  mantaRay.baseX = W * 0.5;
  mantaRay.baseY = H * 0.4;
  mantaRay.size = Math.min(W, H) * 0.25;

  drawBackground(ctx, t);

  mantaRay.update(t);
  mantaRay.draw(ctx, t);

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
