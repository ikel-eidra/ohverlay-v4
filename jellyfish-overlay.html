<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Cyan Jellyfish Overlay — Fluid Kinematics Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const TAU = Math.PI * 2;

      let width = 1, height = 1, pixelRatio = 1;
      let elapsed = 0, lastTime = performance.now();
      let overlayScale = 1.0;
      let targetCount = 3;

      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) overlayScale = scaleParam;
        const countParam = parseInt(urlParams.get('count'), 10);
        if (!isNaN(countParam) && countParam > 0) targetCount = countParam;
      }
      parseParams();

      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
      function lerp(from, to, t) { return from + (to - from) * t; }

      function resize() {
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function createGlowSprite() {
        const sprite = document.createElement('canvas');
        sprite.width = 256; sprite.height = 256;
        const sCtx = sprite.getContext('2d');
        const g = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, 'rgba(0, 243, 255, 1)');
        g.addColorStop(0.18, 'rgba(0, 200, 255, 0.65)');
        g.addColorStop(0.45, 'rgba(0, 120, 210, 0.22)');
        g.addColorStop(0.75, 'rgba(0, 60, 140, 0.05)');
        g.addColorStop(1, 'rgba(0, 20, 60, 0)');
        sCtx.fillStyle = g; sCtx.fillRect(0, 0, 256, 256);
        return sprite;
      }
      const glowSprite = createGlowSprite();

      function pseudoRandom(seed) {
        const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function createJellyfish(index) {
        const seed = index + 1;
        const x = 0.12 + pseudoRandom(seed * 1.3) * 0.76;
        const y = 0.18 + pseudoRandom(seed * 2.7) * 0.64;
        const z = 0.35 + pseudoRandom(seed * 3.9) * 0.65;
        const targetAngle = (pseudoRandom(seed * 4.1) - 0.5) * 0.8;

        return {
          x, y, z,
          vx: (pseudoRandom(seed * 5.3) - 0.5) * 0.02,
          vy: -0.01 - pseudoRandom(seed * 6.7) * 0.02,
          facing: targetAngle,
          visualFacing: targetAngle,
          targetAngle,
          pulsePhase: pseudoRandom(seed * 7.1) * TAU,
          pulseSpeed: 0.75 + pseudoRandom(seed * 8.5) * 0.95,
          thrustPower: 0.07 + pseudoRandom(seed * 9.3) * 0.05,
          seed,
          wanderTimer: 0
        };
      }

      let jellies = Array.from({ length: targetCount }, (_, i) => createJellyfish(i));

      function updateJellyfish(jelly, dt) {
        jelly.pulsePhase = (jelly.pulsePhase + dt * jelly.pulseSpeed) % TAU;
        const pulse = Math.sin(jelly.pulsePhase);

        jelly.wanderTimer -= dt;
        if (jelly.wanderTimer <= 0) {
          jelly.wanderTimer = 3.0 + pseudoRandom(elapsed + jelly.seed) * 5.0;
          jelly.targetAngle = (pseudoRandom(elapsed * 1.3 + jelly.seed) - 0.5) * 0.9;
        }

        const marginX = 0.12; const marginY = 0.14;
        if (jelly.x < marginX) jelly.targetAngle = Math.abs(jelly.targetAngle) + 0.3;
        if (jelly.x > 1 - marginX) jelly.targetAngle = -Math.abs(jelly.targetAngle) - 0.3;
        if (jelly.y < marginY) jelly.targetAngle = Math.PI * 0.6 * (jelly.x > 0.5 ? -1 : 1);
        if (jelly.y > 1 - marginY) jelly.targetAngle = (pseudoRandom(elapsed + jelly.seed) - 0.5) * 0.4;

        jelly.facing = lerp(jelly.facing, jelly.targetAngle, dt * 1.2);
        // Smooth tilt of bell dome
        jelly.visualFacing = lerp(jelly.visualFacing, jelly.facing, dt * 2.0);

        const isSystole = pulse > 0.35;
        if (isSystole) {
          const contractionPower = Math.pow((pulse - 0.35) / 0.65, 1.8);
          const thrust = contractionPower * jelly.thrustPower * dt;
          jelly.vx += Math.sin(jelly.facing) * thrust * 0.6;
          jelly.vy -= Math.cos(jelly.facing) * thrust;
        } else {
          jelly.vy += 0.0015 * dt;
        }

        const dragFactor = isSystole ? 0.90 : 1.35;
        jelly.vx *= Math.exp(-dragFactor * dt);
        jelly.vy *= Math.exp(-dragFactor * dt);

        jelly.x += jelly.vx * dt;
        jelly.y += jelly.vy * dt;

        jelly.x = clamp(jelly.x, 0.05, 0.95);
        jelly.y = clamp(jelly.y, 0.07, 0.93);
      }

      function drawJellyfish(jelly) {
        const depthScale = (0.7 + jelly.z * 0.6) * overlayScale;
        const bellRadius = clamp(Math.min(width, height) * 0.042 * depthScale, 22, 54);
        const pulse = Math.sin(jelly.pulsePhase);
        const contractX = 1.0 - pulse * 0.18;
        const contractY = 1.0 + pulse * 0.25;

        const posX = jelly.x * width;
        const posY = jelly.y * height;
        const bellTilt = jelly.visualFacing;

        // 1. Ambient Luminescent Glow Sprite
        const glowSize = bellRadius * 4.8;
        ctx.save();
        ctx.translate(posX, posY);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + Math.max(0, pulse) * 0.30;
        ctx.drawImage(glowSprite, -glowSize * 0.5, -glowSize * 0.5, glowSize, glowSize);
        ctx.restore();

        // 2. FLUID TENTACLES (Progressive Angle Lag Segment Kinematics — NOT STIFF!)
        ctx.save();
        ctx.translate(posX, posY);
        ctx.lineWidth = 0.8 * depthScale;
        for (let t = 0; t < 8; t++) {
          const spreadRatio = ((t / 7) - 0.5) * 1.5;
          const startX = spreadRatio * bellRadius * contractX * Math.cos(bellTilt);
          const startY = bellRadius * 0.3 * contractY + spreadRatio * bellRadius * Math.sin(bellTilt);
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const tentacleLength = bellRadius * 3.7;
          const segCount = 12;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            // Progressive segment angle lag: base follows bell tilt, tip lags far behind in fluid drag
            const segLagAngle = bellTilt * Math.pow(1.0 - segRatio, 1.8);
            const dragLagY = -jelly.vy * 90 * segRatio * segRatio * depthScale;
            const wave = Math.sin(elapsed * 2.8 - segRatio * 4.2 + t * 0.8 + jelly.seed) * (8 * segRatio * depthScale);
            
            const nodeX = startX + Math.sin(segLagAngle) * (segRatio * tentacleLength) + wave - jelly.vx * 70 * segRatio * depthScale;
            const nodeY = startY + Math.cos(segLagAngle) * (segRatio * tentacleLength) + dragLagY;
            ctx.lineTo(nodeX, nodeY);
          }
          const tentacleAlpha = clamp(0.38 - t * 0.02, 0.18, 0.48);
          ctx.strokeStyle = `rgba(0, 230, 255, ${tentacleAlpha})`;
          ctx.stroke();
        }
        ctx.restore();

        // 3. FLUID CENTRAL ORAL ARMS (4 frilled feeding arms with fluid segment lag)
        ctx.save();
        ctx.translate(posX, posY);
        ctx.lineWidth = 2.2 * depthScale;
        for (let a = 0; a < 4; a++) {
          const armSpread = ((a / 3) - 0.5) * 0.8;
          const startX = armSpread * bellRadius * contractX * Math.cos(bellTilt);
          const startY = bellRadius * 0.4 * contractY;
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const armLength = bellRadius * 3.0;
          const segCount = 10;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            const segLagAngle = bellTilt * Math.pow(1.0 - segRatio, 1.5);
            const wave = Math.sin(elapsed * 1.9 - segRatio * 3.4 + a * 1.2) * (12 * segRatio * depthScale);
            
            const nodeX = startX + Math.sin(segLagAngle) * (segRatio * armLength) + wave - jelly.vx * 50 * segRatio * depthScale;
            const nodeY = startY + Math.cos(segLagAngle) * (segRatio * armLength) - jelly.vy * 60 * segRatio * segRatio * depthScale;
            ctx.lineTo(nodeX, nodeY);
          }
          const armGradient = ctx.createLinearGradient(0, startY, 0, startY + armLength);
          armGradient.addColorStop(0, 'rgba(0, 255, 240, 0.68)');
          armGradient.addColorStop(0.5, 'rgba(0, 180, 255, 0.45)');
          armGradient.addColorStop(1, 'rgba(0, 90, 200, 0.05)');
          ctx.strokeStyle = armGradient;
          ctx.stroke();
        }
        ctx.restore();

        // 4. TRANSLUCENT UMBRELLA BELL (Tilts with bellFacing)
        ctx.save();
        ctx.translate(posX, posY);
        ctx.rotate(bellTilt);
        ctx.scale(depthScale * contractX, depthScale * contractY);

        const bellGradient = ctx.createRadialGradient(0, -bellRadius * 0.2, bellRadius * 0.1, 0, 0, bellRadius);
        bellGradient.addColorStop(0, 'rgba(215, 250, 255, 0.88)');
        bellGradient.addColorStop(0.35, 'rgba(0, 220, 255, 0.52)');
        bellGradient.addColorStop(0.70, 'rgba(0, 110, 210, 0.28)');
        bellGradient.addColorStop(1, 'rgba(0, 40, 110, 0.08)');

        ctx.fillStyle = bellGradient;
        ctx.beginPath();
        ctx.moveTo(-bellRadius, 0);
        ctx.bezierCurveTo(-bellRadius, -bellRadius * 1.35, bellRadius, -bellRadius * 1.35, bellRadius, 0);
        ctx.bezierCurveTo(bellRadius * 0.6, bellRadius * 0.25, -bellRadius * 0.6, bellRadius * 0.25, -bellRadius, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(160, 245, 255, 0.80)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 5. 4 INNER HORSESHOE GONADS
        for (let g = 0; g < 4; g++) {
          const angle = (g / 4) * TAU;
          const gx = Math.cos(angle) * bellRadius * 0.35;
          const gy = Math.sin(angle) * bellRadius * 0.22 - bellRadius * 0.25;
          
          const gonadGradient = ctx.createRadialGradient(gx, gy, 0, gx, gy, bellRadius * 0.18);
          gonadGradient.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
          gonadGradient.addColorStop(0.4, 'rgba(0, 245, 255, 0.82)');
          gonadGradient.addColorStop(1, 'rgba(0, 150, 220, 0)');
          
          ctx.fillStyle = gonadGradient;
          ctx.beginPath();
          ctx.arc(gx, gy, bellRadius * 0.16, 0, TAU);
          ctx.fill();
        }

        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        ctx.clearRect(0, 0, width, height);

        for (const jelly of jellies) {
          updateJellyfish(jelly, dt);
          drawJellyfish(jelly);
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
