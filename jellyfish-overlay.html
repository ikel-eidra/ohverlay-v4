<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Cyan Jellyfish Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const TAU = Math.PI * 2;

      let width = 1, height = 1, pixelRatio = 1;
      let elapsed = 0, lastTime = performance.now();
      let overlayScale = 1.0;
      let targetCount = 3;

      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) overlayScale = scaleParam;
        const countParam = parseInt(urlParams.get('count'), 10);
        if (!isNaN(countParam) && countParam > 0) targetCount = countParam;
      }
      parseParams();

      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
      function lerp(from, to, t) { return from + (to - from) * t; }

      function resize() {
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // Soft Glow Radial Sprite
      function createGlowSprite() {
        const sprite = document.createElement('canvas');
        sprite.width = 256; sprite.height = 256;
        const sCtx = sprite.getContext('2d');
        const g = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, 'rgba(0, 243, 255, 1)');
        g.addColorStop(0.18, 'rgba(0, 200, 255, 0.65)');
        g.addColorStop(0.45, 'rgba(0, 120, 210, 0.22)');
        g.addColorStop(0.75, 'rgba(0, 60, 140, 0.05)');
        g.addColorStop(1, 'rgba(0, 20, 60, 0)');
        sCtx.fillStyle = g; sCtx.fillRect(0, 0, 256, 256);
        return sprite;
      }
      const glowSprite = createGlowSprite();

      function createJellyfish(index) {
        const seed = index + 1;
        const x = 0.15 + (index / Math.max(1, targetCount - 1)) * 0.70;
        const y = 0.20 + (index % 3) * 0.25;
        const facing = (Math.random() - 0.5) * 0.3; // Slight angle from vertical

        return {
          x,
          y,
          z: 0.5 + (index % 3) * 0.22,
          vx: (Math.random() - 0.5) * 0.015,
          vy: -0.012 - Math.random() * 0.015,
          facing,
          visualFacing: facing,
          pulsePhase: Math.random() * TAU,
          pulseSpeed: 1.2 + (index % 3) * 0.3,
          seed,
          tentacleNodes: Array.from({ length: 8 }, () => Array.from({ length: 12 }, () => ({ x: 0, y: 0 }))),
          oralArmNodes: Array.from({ length: 4 }, () => Array.from({ length: 10 }, () => ({ x: 0, y: 0 })))
        };
      }

      let jellies = Array.from({ length: targetCount }, (_, i) => createJellyfish(i));

      function updateJellyfish(jelly, dt) {
        jelly.pulsePhase = (jelly.pulsePhase + dt * jelly.pulseSpeed) % TAU;
        const pulse = Math.sin(jelly.pulsePhase);
        
        // Propulsion during contraction (when pulse > 0.3)
        const contraction = Math.max(0, pulse - 0.2);
        const thrust = contraction * contraction * 0.05;
        
        jelly.vy -= thrust * dt; // Upward force
        jelly.vy += 0.008 * dt; // Slow natural downward drift / gravity

        // Horizontal sway
        jelly.vx += Math.sin(elapsed * 0.8 + jelly.seed) * 0.005 * dt;

        // Apply velocity & dampening
        jelly.vx *= Math.exp(-0.8 * dt);
        jelly.vy *= Math.exp(-0.8 * dt);

        jelly.x += jelly.vx * dt;
        jelly.y += jelly.vy * dt;

        // Strict Margin Clamping (0.05 to 0.95 relative coordinates)
        const marginX = 0.06;
        const marginY = 0.08;
        if (jelly.x < marginX) jelly.vx += (marginX - jelly.x) * 0.2;
        if (jelly.x > 1 - marginX) jelly.vx -= (jelly.x - (1 - marginX)) * 0.2;
        if (jelly.y < marginY) jelly.vy += (marginY - jelly.y) * 0.2;
        if (jelly.y > 1 - marginY) jelly.vy -= (jelly.y - (1 - marginY)) * 0.2;

        jelly.x = clamp(jelly.x, 0.04, 0.96);
        jelly.y = clamp(jelly.y, 0.06, 0.94);

        // Smooth orientation alignment
        const targetFacing = Math.sin(elapsed * 0.5 + jelly.seed) * 0.15;
        jelly.visualFacing = lerp(jelly.visualFacing, targetFacing, dt * 2.0);
      }

      function drawJellyfish(jelly) {
        const depthScale = (0.7 + jelly.z * 0.6) * overlayScale;
        const bellRadius = clamp(Math.min(width, height) * 0.045 * depthScale, 22, 54);
        const pulse = Math.sin(jelly.pulsePhase);

        // Bell contraction deformation factor
        const contractX = 1.0 - pulse * 0.15;
        const contractY = 1.0 + pulse * 0.22;

        ctx.save();
        ctx.translate(jelly.x * width, jelly.y * height);
        ctx.rotate(jelly.visualFacing);
        ctx.scale(depthScale, depthScale);

        // 1. Ambient Glow Sprite behind Bell
        const glowSize = bellRadius * 4.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + Math.max(0, pulse) * 0.25;
        ctx.drawImage(glowSprite, -glowSize * 0.5, -glowSize * 0.5, glowSize, glowSize);
        ctx.restore();

        // 2. Trailing Fine Outer Tentacles (8 tentacles)
        ctx.lineWidth = 0.8;
        for (let t = 0; t < 8; t++) {
          const spread = ((t / 7) - 0.5) * bellRadius * 1.5 * contractX;
          const startX = spread;
          const startY = bellRadius * 0.3;
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const tentacleLength = bellRadius * (3.5 + Math.sin(t * 1.5 + jelly.seed) * 0.5);
          const segCount = 10;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            const wave = Math.sin(elapsed * 2.5 - segRatio * 4.0 + t * 0.8 + jelly.seed) * (8 * segRatio);
            const nodeX = startX + wave + Math.sin(jelly.visualFacing) * segRatio * 10;
            const nodeY = startY + segRatio * tentacleLength;
            ctx.lineTo(nodeX, nodeY);
          }
          const tentacleAlpha = clamp(0.35 - t * 0.02, 0.18, 0.45);
          ctx.strokeStyle = `rgba(0, 230, 255, ${tentacleAlpha})`;
          ctx.stroke();
        }

        // 3. Ruffled Central Oral Arms (4 arms)
        ctx.lineWidth = 2.2;
        for (let a = 0; a < 4; a++) {
          const armSpread = ((a / 3) - 0.5) * bellRadius * 0.8 * contractX;
          const startX = armSpread;
          const startY = bellRadius * 0.4;
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const armLength = bellRadius * 2.8;
          const segCount = 8;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            const wave = Math.sin(elapsed * 1.8 - segRatio * 3.2 + a * 1.2) * (12 * segRatio);
            const nodeX = startX + wave;
            const nodeY = startY + segRatio * armLength;
            ctx.lineTo(nodeX, nodeY);
          }
          const armGradient = ctx.createLinearGradient(0, startY, 0, startY + armLength);
          armGradient.addColorStop(0, 'rgba(0, 255, 240, 0.65)');
          armGradient.addColorStop(0.5, 'rgba(0, 180, 255, 0.42)');
          armGradient.addColorStop(1, 'rgba(0, 90, 200, 0.05)');
          ctx.strokeStyle = armGradient;
          ctx.stroke();
        }

        // 4. Translucent Umbrella Bell (Pulsating)
        ctx.save();
        ctx.scale(contractX, contractY);

        // Bell Body Gradient
        const bellGradient = ctx.createRadialGradient(0, -bellRadius * 0.2, bellRadius * 0.1, 0, 0, bellRadius);
        bellGradient.addColorStop(0, 'rgba(215, 250, 255, 0.85)');
        bellGradient.addColorStop(0.35, 'rgba(0, 220, 255, 0.50)');
        bellGradient.addColorStop(0.70, 'rgba(0, 110, 210, 0.28)');
        bellGradient.addColorStop(1, 'rgba(0, 40, 110, 0.08)');

        ctx.fillStyle = bellGradient;
        ctx.beginPath();
        // Dome Shape
        ctx.moveTo(-bellRadius, 0);
        ctx.bezierCurveTo(-bellRadius, -bellRadius * 1.3, bellRadius, -bellRadius * 1.3, bellRadius, 0);
        // Scalloped Rim Base
        ctx.bezierCurveTo(bellRadius * 0.6, bellRadius * 0.25, -bellRadius * 0.6, bellRadius * 0.25, -bellRadius, 0);
        ctx.closePath();
        ctx.fill();

        // Glowing Rim Highlight
        ctx.strokeStyle = 'rgba(160, 245, 255, 0.75)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 5. Inner Bioluminescent Organs (4 Horseshoe Gonads)
        for (let g = 0; g < 4; g++) {
          const angle = (g / 4) * TAU;
          const gx = Math.cos(angle) * bellRadius * 0.35;
          const gy = Math.sin(angle) * bellRadius * 0.22 - bellRadius * 0.25;
          
          const gonadGradient = ctx.createRadialGradient(gx, gy, 0, gx, gy, bellRadius * 0.18);
          gonadGradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          gonadGradient.addColorStop(0.4, 'rgba(0, 245, 255, 0.80)');
          gonadGradient.addColorStop(1, 'rgba(0, 150, 220, 0)');
          
          ctx.fillStyle = gonadGradient;
          ctx.beginPath();
          ctx.arc(gx, gy, bellRadius * 0.16, 0, TAU);
          ctx.fill();
        }

        ctx.restore(); // Restore contraction scale
        ctx.restore(); // Restore global translation/rotation
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        ctx.clearRect(0, 0, width, height);

        for (const jelly of jellies) {
          updateJellyfish(jelly, dt);
          drawJellyfish(jelly);
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
