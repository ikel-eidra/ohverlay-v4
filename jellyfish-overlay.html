<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Cyan Jellyfish Overlay — Pulsed-Jet Physics Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const TAU = Math.PI * 2;

      let width = 1, height = 1, pixelRatio = 1;
      let elapsed = 0, lastTime = performance.now();
      let overlayScale = 1.0;
      let targetCount = 3;

      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) overlayScale = scaleParam;
        const countParam = parseInt(urlParams.get('count'), 10);
        if (!isNaN(countParam) && countParam > 0) targetCount = countParam;
      }
      parseParams();

      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
      function lerp(from, to, t) { return from + (to - from) * t; }

      function resize() {
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function createGlowSprite() {
        const sprite = document.createElement('canvas');
        sprite.width = 256; sprite.height = 256;
        const sCtx = sprite.getContext('2d');
        const g = sCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, 'rgba(0, 243, 255, 1)');
        g.addColorStop(0.18, 'rgba(0, 200, 255, 0.65)');
        g.addColorStop(0.45, 'rgba(0, 120, 210, 0.22)');
        g.addColorStop(0.75, 'rgba(0, 60, 140, 0.05)');
        g.addColorStop(1, 'rgba(0, 20, 60, 0)');
        sCtx.fillStyle = g; sCtx.fillRect(0, 0, 256, 256);
        return sprite;
      }
      const glowSprite = createGlowSprite();

      function createJellyfish(index) {
        const seed = index + 1;
        const x = 0.15 + (index / Math.max(1, targetCount - 1)) * 0.70;
        const y = 0.25 + (index % 3) * 0.25;

        return {
          x,
          y,
          z: 0.5 + (index % 3) * 0.22,
          vx: (Math.random() - 0.5) * 0.008,
          vy: -0.015,
          facing: 0,
          visualFacing: 0,
          // Pulsed-Jet Locomotion States: 'systole' (rapid contraction jet) vs 'diastole' (slow refill glide)
          pulsePhase: Math.random() * TAU,
          pulseSpeed: 1.1 + (index % 3) * 0.25,
          seed
        };
      }

      let jellies = Array.from({ length: targetCount }, (_, i) => createJellyfish(i));

      // Scientific Pulsed-Jet Locomotion Physics
      function updateJellyfish(jelly, dt) {
        jelly.pulsePhase = (jelly.pulsePhase + dt * jelly.pulseSpeed) % TAU;
        const pulse = Math.sin(jelly.pulsePhase);
        
        // 1. SYSTOLE (RAPID CONTRACTION JET PROPULSION):
        // When pulse rises past 0.35, high-velocity water jet is ejected downwards out of the bell cavity, propelling jelly upwards (-Y)
        const isSystole = pulse > 0.35;
        if (isSystole) {
          const contractionPower = Math.pow((pulse - 0.35) / 0.65, 1.8);
          jelly.vy -= contractionPower * 0.075 * dt; // Upward jet thrust
        } else {
          // 2. DIASTOLE (PASSIVE REFILL & SLOW VISCOUS GLIDE):
          // Water refills cavity; viscous drag slows forward momentum and gravity induces gentle buoyant sinking
          jelly.vy += 0.006 * dt; // Buoyancy sink
        }

        // Horizontal ambient sway
        jelly.vx += Math.sin(elapsed * 0.7 + jelly.seed * 2.3) * 0.004 * dt;

        // Hydrodynamic viscous drag dampening
        const dragFactor = isSystole ? 0.95 : 1.65;
        jelly.vx *= Math.exp(-dragFactor * dt);
        jelly.vy *= Math.exp(-dragFactor * dt);

        jelly.x += jelly.vx * dt;
        jelly.y += jelly.vy * dt;

        // Strict Margin Clamping (0.05 to 0.95 relative screen bounds)
        const marginX = 0.06; const marginY = 0.08;
        if (jelly.x < marginX) jelly.vx += (marginX - jelly.x) * 0.25;
        if (jelly.x > 1 - marginX) jelly.vx -= (jelly.x - (1 - marginX)) * 0.25;
        if (jelly.y < marginY) jelly.vy += (marginY - jelly.y) * 0.25;
        if (jelly.y > 1 - marginY) jelly.vy -= (jelly.y - (1 - marginY)) * 0.25;

        jelly.x = clamp(jelly.x, 0.04, 0.96);
        jelly.y = clamp(jelly.y, 0.06, 0.94);

        // Smooth sway tilt in direction of velocity
        const targetFacing = clamp(jelly.vx * 4.5 + Math.sin(elapsed * 0.4 + jelly.seed) * 0.12, -0.25, 0.25);
        jelly.visualFacing = lerp(jelly.visualFacing, targetFacing, dt * 2.5);
      }

      function drawJellyfish(jelly) {
        const depthScale = (0.7 + jelly.z * 0.6) * overlayScale;
        const bellRadius = clamp(Math.min(width, height) * 0.042 * depthScale, 22, 54);
        const pulse = Math.sin(jelly.pulsePhase);

        // Bell Systole/Diastole Deformation
        const contractX = 1.0 - pulse * 0.18;
        const contractY = 1.0 + pulse * 0.25;

        ctx.save();
        ctx.translate(jelly.x * width, jelly.y * height);
        ctx.rotate(jelly.visualFacing);
        ctx.scale(depthScale, depthScale);

        // 1. Ambient Luminescent Glow Sprite
        const glowSize = bellRadius * 4.8;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + Math.max(0, pulse) * 0.30;
        ctx.drawImage(glowSprite, -glowSize * 0.5, -glowSize * 0.5, glowSize, glowSize);
        ctx.restore();

        // 2. Trailing Fine Marginal Tentacles (8 tentacles with viscous fluid drag drape)
        ctx.lineWidth = 0.8;
        for (let t = 0; t < 8; t++) {
          const spread = ((t / 7) - 0.5) * bellRadius * 1.5 * contractX;
          const startX = spread;
          const startY = bellRadius * 0.3;
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const tentacleLength = bellRadius * 3.6;
          const segCount = 10;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            // Fluid drag vector: tentacles bend backwards during upward pulse thrust
            const dragLag = -jelly.vy * 80 * segRatio * segRatio;
            const wave = Math.sin(elapsed * 2.8 - segRatio * 4.2 + t * 0.8 + jelly.seed) * (7 * segRatio);
            const nodeX = startX + wave - jelly.vx * 60 * segRatio;
            const nodeY = startY + segRatio * tentacleLength + dragLag;
            ctx.lineTo(nodeX, nodeY);
          }
          const tentacleAlpha = clamp(0.38 - t * 0.02, 0.18, 0.48);
          ctx.strokeStyle = `rgba(0, 230, 255, ${tentacleAlpha})`;
          ctx.stroke();
        }

        // 3. Ruffled Central Oral Arms (4 frilled feeding arms)
        ctx.lineWidth = 2.2;
        for (let a = 0; a < 4; a++) {
          const armSpread = ((a / 3) - 0.5) * bellRadius * 0.8 * contractX;
          const startX = armSpread;
          const startY = bellRadius * 0.4;
          
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          
          const armLength = bellRadius * 2.9;
          const segCount = 8;
          for (let s = 1; s <= segCount; s++) {
            const segRatio = s / segCount;
            const wave = Math.sin(elapsed * 1.9 - segRatio * 3.4 + a * 1.2) * (11 * segRatio);
            const nodeX = startX + wave - jelly.vx * 40 * segRatio;
            const nodeY = startY + segRatio * armLength - jelly.vy * 50 * segRatio * segRatio;
            ctx.lineTo(nodeX, nodeY);
          }
          const armGradient = ctx.createLinearGradient(0, startY, 0, startY + armLength);
          armGradient.addColorStop(0, 'rgba(0, 255, 240, 0.68)');
          armGradient.addColorStop(0.5, 'rgba(0, 180, 255, 0.45)');
          armGradient.addColorStop(1, 'rgba(0, 90, 200, 0.05)');
          ctx.strokeStyle = armGradient;
          ctx.stroke();
        }

        // 4. Translucent Umbrella Bell (Exumbrella & Subumbrella Dome)
        ctx.save();
        ctx.scale(contractX, contractY);

        const bellGradient = ctx.createRadialGradient(0, -bellRadius * 0.2, bellRadius * 0.1, 0, 0, bellRadius);
        bellGradient.addColorStop(0, 'rgba(215, 250, 255, 0.88)');
        bellGradient.addColorStop(0.35, 'rgba(0, 220, 255, 0.52)');
        bellGradient.addColorStop(0.70, 'rgba(0, 110, 210, 0.28)');
        bellGradient.addColorStop(1, 'rgba(0, 40, 110, 0.08)');

        ctx.fillStyle = bellGradient;
        ctx.beginPath();
        // Umbrella Dome
        ctx.moveTo(-bellRadius, 0);
        ctx.bezierCurveTo(-bellRadius, -bellRadius * 1.35, bellRadius, -bellRadius * 1.35, bellRadius, 0);
        // Scalloped Margin Lappets
        ctx.bezierCurveTo(bellRadius * 0.6, bellRadius * 0.25, -bellRadius * 0.6, bellRadius * 0.25, -bellRadius, 0);
        ctx.closePath();
        ctx.fill();

        // Glowing Glassy Rim Highlight
        ctx.strokeStyle = 'rgba(160, 245, 255, 0.80)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 5. 4 Inner Horseshoe Bioluminescent Gonads
        for (let g = 0; g < 4; g++) {
          const angle = (g / 4) * TAU;
          const gx = Math.cos(angle) * bellRadius * 0.35;
          const gy = Math.sin(angle) * bellRadius * 0.22 - bellRadius * 0.25;
          
          const gonadGradient = ctx.createRadialGradient(gx, gy, 0, gx, gy, bellRadius * 0.18);
          gonadGradient.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
          gonadGradient.addColorStop(0.4, 'rgba(0, 245, 255, 0.82)');
          gonadGradient.addColorStop(1, 'rgba(0, 150, 220, 0)');
          
          ctx.fillStyle = gonadGradient;
          ctx.beginPath();
          ctx.arc(gx, gy, bellRadius * 0.16, 0, TAU);
          ctx.fill();
        }

        ctx.restore(); // Restore contraction scale
        ctx.restore(); // Restore global matrix
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        ctx.clearRect(0, 0, width, height);

        for (const jelly of jellies) {
          updateJellyfish(jelly, dt);
          drawJellyfish(jelly);
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
