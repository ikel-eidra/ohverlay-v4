<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Butterflies Overlay</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="butterflies"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('butterflies');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const parameters = new URLSearchParams(location.search);
      const globalScale = parseFloat(parameters.get('scale')) || 1.0;
      
      const TAU = Math.PI * 2;
      let width = 1;
      let height = 1;
      let pixelRatio = 1;
      let lastTime = performance.now();
      
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function seeded(seed, offset) {
        let x = Math.sin(seed * 29.3 + offset * 17.1) * 10000;
        return x - Math.floor(x);
      }
      function angleDifference(a, b) {
        let diff = (b - a) % TAU;
        if (diff < -Math.PI) diff += TAU;
        if (diff > Math.PI) diff -= TAU;
        return diff;
      }

      const butterflies = [];
      const numButterflies = 3;

      for (let i = 0; i < numButterflies; i++) {
        butterflies.push({
          id: i,
          x: seeded(i, 1) * 2000,
          y: seeded(i, 2) * 1000,
          vx: 0,
          vy: 0,
          facing: seeded(i, 3) * TAU,
          targetAngle: 0,
          flutterPhase: seeded(i, 4) * TAU,
          flutterSpeed: 15 + seeded(i, 5) * 10,
          speed: 120 + seeded(i, 6) * 60,
          wanderAngle: seeded(i, 7) * TAU,
          scale: 0.9 + seeded(i, 8) * 0.3,
          z: 1.0,
          vz: 0,
          behavior: 'wander',
          restTimer: 0
        });
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        pixelRatio = window.devicePixelRatio || 1;
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        ctx.scale(pixelRatio, pixelRatio);
        
        // Ensure butterflies are on screen
        for (const b of butterflies) {
            if (b.x > width) b.x = width * Math.random();
            if (b.y > height) b.y = height * Math.random();
        }
      }

      function drawButterfly(ctx, b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.facing);
        ctx.scale(b.scale * globalScale, b.scale * globalScale);

        // Flutter calculates how "flat" the wings are (3D effect)
        const wingFlap = Math.sin(b.flutterPhase);
        // Map sine from [-1, 1] to [0.2, 1.0] for wing width scale
        const wingScaleX = 0.6 + wingFlap * 0.4; 
        
        // Dark outline color
        const darkColor = '#111820';
        // Morpho blue color
        const blueColor = '#3a7df0';
        const innerBlue = '#5c98ff';

        // Draw Antennae
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.quadraticCurveTo(-3, -15, -6, -20);
        ctx.moveTo(0, -6);
        ctx.quadraticCurveTo(3, -15, 6, -20);
        ctx.strokeStyle = darkColor;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.save();
        // Scale wings to simulate 3D flapping (up and down)
        ctx.scale(wingScaleX, 1);

        // Create wing gradient for iridescent morpho look
        const wingGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
        wingGrad.addColorStop(0, innerBlue);
        wingGrad.addColorStop(0.8, blueColor);
        wingGrad.addColorStop(1, darkColor);

        ctx.fillStyle = wingGrad;
        ctx.strokeStyle = darkColor;
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';

        // Left Forewing
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.bezierCurveTo(-20, -10, -50, -25, -45, -45);
        ctx.bezierCurveTo(-40, -55, -20, -35, -5, 0);
        ctx.fill();
        ctx.stroke();

        // Right Forewing
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.bezierCurveTo(20, -10, 50, -25, 45, -45);
        ctx.bezierCurveTo(40, -55, 20, -35, 5, 0);
        ctx.fill();
        ctx.stroke();

        // Left Hindwing
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.bezierCurveTo(-25, 10, -35, 30, -25, 40);
        ctx.bezierCurveTo(-15, 45, -5, 30, 0, 15);
        ctx.fill();
        ctx.stroke();

        // Right Hindwing
        ctx.beginPath();
        ctx.moveTo(5, 0);
        ctx.bezierCurveTo(25, 10, 35, 30, 25, 40);
        ctx.bezierCurveTo(15, 45, 5, 30, 0, 15);
        ctx.fill();
        ctx.stroke();

        ctx.restore(); // Restore wing scale

        // Draw Body (Thorax and Abdomen)
        ctx.fillStyle = darkColor;
        // Thorax
        ctx.beginPath();
        ctx.ellipse(0, -2, 2.5, 5, 0, 0, TAU);
        ctx.fill();
        // Abdomen
        ctx.beginPath();
        ctx.ellipse(0, 8, 1.8, 10, 0, 0, TAU);
        ctx.fill();
        // Head
        ctx.beginPath();
        ctx.arc(0, -8, 2.5, 0, TAU);
        ctx.fill();

        ctx.restore();
      }

      function update(dt) {
        for (let i = 0; i < butterflies.length; i++) {
          const b = butterflies[i];

          if (b.behavior === 'wander') {
              // Fluttery flight path
              b.wanderAngle += (Math.random() - 0.5) * 4.0 * dt;
              b.targetAngle = b.wanderAngle;
              
              // Move forward
              const targetVx = Math.sin(b.facing) * b.speed;
              const targetVy = -Math.cos(b.facing) * b.speed;
              
              b.vx = lerp(b.vx, targetVx, 2.0 * dt);
              b.vy = lerp(b.vy, targetVy, 2.0 * dt);
              
              // Flap wings
              b.flutterPhase += b.flutterSpeed * dt;

              // Occasionally rest
              if (Math.random() < 0.002) {
                  b.behavior = 'rest';
                  b.restTimer = 2.0 + Math.random() * 4.0;
              }
          } else if (b.behavior === 'rest') {
              b.vx *= 0.9;
              b.vy *= 0.9;
              b.restTimer -= dt;
              
              // Slow wing flaps while resting
              b.flutterPhase += (b.flutterSpeed * 0.05) * dt;

              if (b.restTimer <= 0) {
                  b.behavior = 'wander';
                  b.wanderAngle = b.facing + (Math.random() - 0.5) * TAU;
              }
          } else if (b.behavior === 'flee') {
              b.flutterPhase += (b.flutterSpeed * 1.5) * dt; // Flap faster
              b.vx = lerp(b.vx, Math.sin(b.facing) * b.speed * 2.0, 5.0 * dt);
              b.vy = lerp(b.vy, -Math.cos(b.facing) * b.speed * 2.0, 5.0 * dt);
              
              b.restTimer -= dt;
              if (b.restTimer <= 0) {
                  b.behavior = 'wander';
                  b.wanderAngle = b.facing;
              }
          }

          // Update position
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          // Turn towards target angle
          const diff = angleDifference(b.facing, b.targetAngle);
          b.facing += diff * 4.0 * dt;

          // Wrap around screen
          if (b.x < -100) b.x = width + 100;
          if (b.x > width + 100) b.x = -100;
          if (b.y < -100) b.y = height + 100;
          if (b.y > height + 100) b.y = -100;
        }
      }

      function draw(ctx) {
        for (const b of butterflies) {
          drawButterfly(ctx, b);
        }
      }

      function animate(time) {
        const dt = Math.min(0.05, (time - lastTime) / 1000);
        lastTime = time;
        ctx.clearRect(0, 0, width, height);
        update(dt);
        draw(ctx);
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
